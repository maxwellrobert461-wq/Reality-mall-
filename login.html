<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - REALITY MALL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;background:#f5f6fa;display:flex;justify-content:center;padding:20px}.card{background:#fff;width:100%;max-width:400px;padding:24px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.06)} input{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:2px solid #eef3ff;background:#eef3ff;font-size:16px} button{width:100%;padding:14px;background:#000;color:#fff;border:none;border-radius:10px;font-weight:800;margin-top:10px;cursor:pointer} button.white{background:#fff;color:#000;border:2px solid #000}</style>
</head><body>
<div class="card">
<h1>Login to<br>REALITY MALL</h1>
<input id="email" placeholder="Email" value="chidaluvitalisodera@gmail.com">
<input id="phone" placeholder="Phone +234..." value="+2349078617514">
<input id="pass" type="password" placeholder="Password" value="12345678">
<button onclick="login()">Log In</button>
<button class="white" onclick="signup()">Create Account - Post with your number</button>
<p><a href="index.html">← Back to Mall</a></p>
<div id="msg" style="margin-top:12px;font-weight:bold"></div>
</div>
<script>
const client=supabase.createClient('https://trawtkndvzsplcmmtjox.supabase.co','sb_publishable_ACkUQyZDMHThA7SYE1ME2w_HMNjyIXg');
function saveOffline(e,p,ph){
 localStorage.setItem('myEmail',e);
 localStorage.setItem('userPhone',ph);
 localStorage.setItem('myShop','Odera chidalu Vitalis');
 localStorage.setItem('user_id', 'user_'+Date.now());
}
async function signup(){
 let e=document.getElementById('email').value, ph=document.getElementById('phone').value, p=document.getElementById('pass').value;
 let m=document.getElementById('msg');
 if(!e||!p){m.innerText='Fill email and password'; return}
 m.innerText='Creating...';
 try{
  let {data,error}=await client.auth.signUp({email:e,password:p,options:{data:{phone:ph,full_name:'Odera chidalu Vitalis'}}});
  if(error) throw error;
  saveOffline(e,p,ph);
  m.style.color='green'; m.innerText='✅ Account created! Redirecting to mall...';
  setTimeout(()=>location.href='index.html',1000);
 }catch(err){
  // If rate limit, login offline anyway!
  if(err.message.includes('rate limit') || err.message.includes('Email rate')){
   saveOffline(e,p,ph);
   m.style.color='orange'; 
   m.innerHTML='⚠️ Supabase rate limit, but you are logged in OFFLINE!<br>Your phone '+ph+' is saved. You can post products now.<br><br><button onclick="location.href=\'index.html\'" style=background:#ffc300;color:#000;padding:8px 12px;border:none;border-radius:8px>Go to Mall →</button>';
  } else {
   m.style.color='red'; m.innerText='Error: '+err.message;
  }
 }
}
async function login(){
 let e=document.getElementById('email').value, ph=document.getElementById('phone').value, p=document.getElementById('pass').value;
 let m=document.getElementById('msg');
 m.innerText='Logging in...';
 try{
  let {data,error}=await client.auth.signInWithPassword({email:e,password:p});
  if(error) throw error;
  saveOffline(e,p,ph);
  m.style.color='green'; m.innerText='✅ Login success!'; location.href='index.html';
 }catch(err){
  if(err.message.includes('rate limit')){
   saveOffline(e,p,ph);
   m.style.color='orange'; m.innerHTML='⚠️ Rate limit but logged in OFFLINE as '+ph+'<br><a href=index.html>Go to Mall</a>';
  } else if(err.message.includes('Invalid')){
   // Try signup if login fails
   signup();
  } else {
   m.style.color='red'; m.innerText=err.message;
  }
 }
}
</script>
</body></html>
