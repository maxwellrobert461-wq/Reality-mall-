<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REALITY MALL</title>
<style>
*{box-sizing:border-box;font-family:-apple-system,Arial} body{margin:0;background:#fff;display:flex;justify-content:center;min-height:100vh}
.wrap{width:100%;max-width:380px;padding:20px 20px 10px}
.logo{width:90px;height:90px;background:#0d63f2;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:48px;font-weight:900;margin:40px auto 16px}
h1{font-size:28px;text-align:center;margin:0;font-weight:800} p.sub{text-align:center;color:#333;font-size:20px;margin:12px 0 24px}
input{width:100%;padding:16px 14px;border:2px solid #dddfe2;border-radius:12px;margin:10px 0;font-size:16px;background:#f5f6f7}
.btn{width:100%;padding:14px;background:#0d63f2;color:#fff;border:none;border-radius:30px;font-size:18px;font-weight:700;margin:14px 0}
.btn-outline{width:100%;padding:14px;background:#fff;color:#0d63f2;border:2px solid #0d63f2;border-radius:30px;font-size:16px;font-weight:700}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:#777}.divider:before,.divider:after{content:'';flex:1;height:1px;background:#ddd}
a.blue{color:#0d63f2;text-decoration:none;font-weight:600;display:block;text-align:center;margin:10px 0}
.footer{text-align:center;color:#777;font-size:12px;margin-top:40px}
</style>
</head><body>
<div class="wrap">
<div style="display:flex;justify-content:flex-end;font-size:13px"><span style="background:#f0f0f0;padding:6px 12px;border-radius:16px">English (US) ▾</span></div>
<div class="logo">R</div>
<h1>REALITY MALL</h1>
<p class="sub">Log in to REALITY MALL</p>
<input id="email" placeholder="Mobile number or email" value="+2349078617514">
<input id="pass" type="password" placeholder="Password">
<button class="btn" onclick="login()">Log in</button>
<a class="blue" href="#">Forgotten password?</a>
<div class="divider">or</div>
<button class="btn-outline" onclick="signup()">Create new account</button>
<div class="footer">Meta · About · Help · Privacy · Terms · Cookies</div>
</div>
<script>
function login(){
 localStorage.setItem('userPhone',document.getElementById('email').value);
 localStorage.setItem('myShop','Odera chidalu Vitalis');
 location.href='index.html';
}
function signup(){login()}
</script>
</body></html>
