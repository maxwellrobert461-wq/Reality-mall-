<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reality Mall - Warri Marketplace</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4813832175831420" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box;font-family:Arial} body{margin:0;background:#f0f2f5;padding-bottom:90px}
.top{ background:#fff; padding:10px 14px 12px; position:sticky; top:0; z-index:10; border-bottom:1px solid #eee}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px;background:#fff;position:sticky;top:78px;z-index:9}
.tabBtn{white-space:nowrap;padding:8px 16px;border-radius:20px;border:1px solid #ddd;background:#f0f2f5;font-weight:700;font-size:14px}
.activeTab{background:#0d63f2!important;color:#fff!important;border-color:#0d63f2!important}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #eee;z-index:99}
</style></head><body>
<div class="top">
<div style="display:flex;justify-content:space-between;align-items:center">
<h1 style="margin:0;color:#0d3c9c;font-size:26px;font-weight:800">Shops</h1>
<div style="display:flex;gap:10px;align-items:center">
<div id="topProf" onclick="location.href='profile.html'" style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#0d63f2,#4a90e2);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;cursor:pointer;border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.2)">O</div>
<div onclick="location.href='chat.html'" style="width:38px;height:38px;border-radius:50%;background:#f0f2f5;display:flex;align-items:center;justify-content:center;cursor:pointer">💬</div>
<div onclick="location.href='wallet.html'" style="width:38px;height:38px;border-radius:50%;background:#f0f2f5;display:flex;align-items:center;justify-content:center;cursor:pointer">🔔</div>
</div>
</div>
<div style="margin-top:10px"><input id="search" placeholder="Search shops, posts..." style="width:100%;padding:12px 16px;border-radius:24px;border:1px solid #e0e0e0;background:#f0f2f5;outline:none" oninput="filterShops()"></div>
</div>

<div class="tabs"><div class="tabBtn activeTab" onclick="setFilter('All',this)">All</div><div class="tabBtn" onclick="setFilter('Feed',this)">Feed</div><div class="tabBtn" onclick="setFilter('Reels',this)">🎬 Reels</div><div class="tabBtn" onclick="setFilter('Fashion',this)">Fashion</div><div class="tabBtn" onclick="setFilter('Electronics',this)">Electronics</div></div>

<h3 style="margin:12px 14px 0">Shops & Feed</h3>
<div id="shopGrid" class="grid"></div>

<div style="background:#fff;margin:8px;border-radius:12px;padding:10px;border:1px solid #eee">
<small style="color:#999">Advertisement</small>
<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-4813832175831420" data-ad-slot="1111111111" data-ad-format="auto" data-full-width-responsive="true"></ins>
<script>(adsbygoogle=window.adsbygoogle||[]).push({});</script>
</div>

<div class="nav">
<div style="text-align:center;font-size:12px;color:#0d63f2;font-weight:800">🏠<br>Home</div>
<div onclick="location.href='shop.html'" style="text-align:center;font-size:12px">🛍️<br>Shop</div>
<div onclick="location.href='post.html'" style="width:56px;height:56px;background:#000;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;margin-top:-22px;border:3px solid #fff">+</div>
<div onclick="location.href='chat.html'" style="text-align:center;font-size:12px">✉️<br>Inbox</div>
<div onclick="location.href='wallet.html'" style="text-align:center;font-size:12px">💰<br>Wallet</div>
<div onclick="location.href='profile.html'" style="text-align:center;font-size:12px">👤<br>You</div>
</div>

<script>
function getPosts(){return JSON.parse(localStorage.getItem('rm_posts')||'[]')}
function getProf(){return JSON.parse(localStorage.getItem('rm_profile')||'{}')}
let defaultShops=[
{title:"Odera Fashion", price:"₦15,000", cat:"Fashion", warri:true, verified:true, img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400", seller:"Odera"},
{title:"OC GLOBAL TECH", price:"₦12,500", cat:"Electronics", warri:true, verified:true, img:"https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=400", seller:"OC"},
{title:"Warri Gadgets", price:"₦9,800", cat:"Electronics", warri:true, verified:true, img:"https://images.unsplash.com/photo-1572569511254-d8f925fe2cbb?w=400", seller:"Warri Gadgets"},
{title:"Reality Mall Official", price:"₦27,000", cat:"Fashion", warri:true, verified:true, img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400", seller:"Reality Mall"}
];
function render(filter="All"){
let posts=getPosts(); let all=[...posts.map(p=>({title:p.title, price:"₦"+p.price, cat:p.cat||"Feed", warri:true, verified:false, img:p.img, seller:p.seller})),...defaultShops];
if(filter!="All") all=all.filter(s=>s.cat==filter);
let q=document.getElementById('search').value.toLowerCase(); if(q) all=all.filter(s=>s.title.toLowerCase().includes(q));
document.getElementById('shopGrid').innerHTML=all.map(s=>`
<div class="card"><div style="position:relative"><img src="${s.img}" style="width:100%;height:160px;object-fit:cover"><span style="position:absolute;top:8px;right:8px;background:#0d63f2;color:#fff;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700">Warri</span></div>
<div style="padding:8px"><b style="font-size:14px">${s.title} ${s.verified?'✔️':''}</b><div style="font-size:13px;color:#555">${s.price} • ⭐ 4.9</div>
<div style="display:flex;gap:6px;margin-top:6px"><button style="flex:1;background:#0d63f2;color:#fff;border:none;border-radius:18px;padding:8px;font-weight:700;font-size:12px" onclick="location.href='shop.html?seller=${encodeURIComponent(s.seller)}'">Visit</button><button style="flex:1;background:#25d366;color:#fff;border:none;border-radius:18px;padding:8px;font-weight:700;font-size:12px" onclick="window.open('https://wa.me/2349078617514?text=Hi ${s.seller} from Reality Mall','_blank')">WhatsApp</button></div></div></div>
`).join('')||'<div style="grid-column:span 2;text-align:center;padding:20px;color:#888">No shops found</div>';
let p=getProf(); if(p.name){let el=document.getElementById('topProf'); el.innerText=p.name[0].toUpperCase(); if(p.pic) el.innerHTML='<img src="'+p.pic+'" style="width:38px;height:38px;border-radius:50%;object-fit:cover">';}
}
function setFilter(c,el){document.querySelectorAll('.tabBtn').forEach(b=>b.classList.remove('activeTab')); el.classList.add('activeTab'); render(c);}
function filterShops(){render(document.querySelector('.activeTab').innerText.replace('🎬 ',''));}
render();
</script></body></html>
