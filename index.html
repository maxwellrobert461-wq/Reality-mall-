<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REALITY MALL - Warri No.1 Marketplace</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<style>
*{box-sizing:border-box;font-family:Arial, sans-serif}
body{margin:0;background:#f5f6fa}
.header{background:#000;color:#fff;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-weight:900;font-size:20px;color:#ffb400;text-decoration:none}
.search{flex:1;margin:0 10px;background:#222;border-radius:20px;display:flex;align-items:center;padding:6px 12px}
.search input{flex:1;background:transparent;border:none;color:#fff;outline:none}
.btn{padding:8px 14px;border-radius:20px;border:none;font-weight:bold;text-decoration:none;display:inline-block}
.btn-yellow{background:#ffb400;color:#000}
.btn-white{background:#fff;color:#000}
.hero{background:linear-gradient(135deg,#000,#333);color:#fff;padding:20px 15px;text-align:center}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.card img{width:100%;height:160px;object-fit:cover}
.card-body{padding:10px}
.price{color:green;font-weight:900}
.shop{color:#888;font-size:12px}
#langFloat{position:fixed;bottom:20px;right:20px;z-index:9999;background:#000;color:#fff;padding:10px 14px;border-radius:25px;box-shadow:0 4px 15px rgba(0,0,0,.3);border:2px solid #ffb400}
#langFloat select{background:transparent;color:#fff;border:none;font-weight:bold;outline:none}
#google_translate_element{display:none}
.topbar{display:flex;gap:8px;overflow-x:auto;padding:10px;background:#fff;border-bottom:1px solid #eee}
.topbar button{white-space:nowrap;padding:8px 14px;border-radius:20px;border:1px solid #ddd;background:#fff}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
<a href="index.html" class="logo">REALITY MALL</a>
<div class="search"><input id="q" placeholder="Search products in Warri..." oninput="filter()"><span>🔍</span></div>
<div style="display:flex;gap:6px">
<a href="signup.html" class="btn btn-yellow">Sign Up</a>
<a href="dashboard.html" class="btn btn-white">+ Post</a>
</div>
</div>

<!-- HERO -->
<div class="hero">
<h2 id="hero1" style="margin:0">Warri No.1 Online Mall 🛒</h2>
<p id="hero2" style="margin:6px 0;color:#ccc">Buy & Sell in Warri, Ughelli, Sapele - Same Day Delivery</p>
<div style="margin-top:12px">
<a href="signup.html" class="btn btn-yellow">Create Free Shop</a>
<a href="profile.html?shop=Odera%20chidalu%20vitalis" class="btn btn-white" style="margin-left:6px">View My Profile</a>
</div>
</div>

<!-- CATEGORIES -->
<div class="topbar">
<button onclick="cat='all';load()">All</button>
<button onclick="cat='phones';load()">Phones</button>
<button onclick="cat='fashion';load()">Fashion</button>
<button onclick="cat='electronics';load()">Electronics</button>
<button onclick="cat='home';load()">Home</button>
