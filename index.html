<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REALITY MALL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;margin:0;background:#fff}
.header{background:#000;color:#fff;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.feeds{display:flex;gap:8px;padding:10px;overflow:auto;white-space:nowrap;border-bottom:1px solid #eee;position:sticky;top:54px;background:#fff}
.feed-btn{padding:8px 18px;border-radius:20px;border:1px solid #ddd;background:#fff;font-weight:bold;cursor:pointer}
.feed-btn.active{background:#000;color:#fff}
.product-card{border-bottom:1px solid #eee;padding:15px}
.product-card img{width:100%;border-radius:10px;max-height:400px;object-fit:cover}
.price{color:green;font-weight:bold;font-size:18px}
.btn{padding:10px 15px;background:#000;color:#fff;border:none;border-radius:8px;width:100%;margin-top:8px;font-weight:bold}
</style>
</head>
<body>
<div class="header"><h2 style="margin:0">REALITY.</h2><a href="dashboard.html" style="background:#fff;color:#000;padding:8px 15px;border-radius:20px;text-decoration:none;font-weight:bold">+ Post Free</a></div>
<div class="feeds">
<button class="feed-btn active" onclick="loadFeed('all',this)">Home</button>
<button class="feed-btn" onclick="loadFeed('shops',this)">Shops</button>
<button class="feed-btn" onclick="loadFeed('posts',this)">Posts</button>
<button class="feed-btn" onclick="loadFeed('video',this)">Video</button>
<button class="feed-btn" onclick="loadFeed('viral',this)">Viral 🔥</button>
</div>
<div id="products" style="padding:10px"><p>Loading REALITY MALL...</p></div>

<script>
const SUPABASE_URL = 'https://trawtkndvzsplcmmtjox.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ACkUQyZDMHThA7SYE1ME2w_HMNjyIXg';
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadFeed(type, btn){
 if(btn){document.querySelectorAll('.feed-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
 let q = client.from('products').select('*').order('created_at',{ascending:false}).eq('status','approved');
 if(type==='shops') q=q.eq('feed_type','shops');
 if(type==='posts') q=q.eq('feed_type','posts');
 if(type==='video') q=q.eq('feed_type','video');
 if(type==='viral') q=q.order('views',{ascending:false});
 const {data,error} = await q;
 if(error){document.getElementById('products').innerHTML='<p>Error: '+error.message+'</p>';return}
 if(!data||data.length==0){document.getElementById('products').innerHTML='<p style="text-align:center;padding:50px">No products yet.<br>Be first to post!<br><br><a href="dashboard.html" style="background:#000;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none">+ Post Now</a></p>';return}
 document.getElementById('products').innerHTML=data.map(p=>`
  <div class="product-card">
    <img src="${p.image||''}" onerror="this.style.display='none'">
    <h3>${p.name||'No name'}</h3>
    <p>${p.shop_name||''} • ${p.views||0} views</p>
    <p class="price">₦${(p.price||0).toLocaleString()}</p>
    <a href="https://wa.me/${p.whatsapp}?text=Hi, I want ${p.name} from REALITY MALL" target="_blank"><button class="btn">Chat on WhatsApp</button></a>
  </div>
 `).join('');
}
loadFeed('all');
</script>
</body>
</html>
