<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REALITY MALL - Warri No.1</title>
<style>
*{box-sizing:border-box;font-family:Arial} body{margin:0;background:#f7f7f8;padding-bottom:80px}
.top{background:#0f1115;color:#fff;padding:14px 16px 70px;border-radius:0 0 24px 24px}
.logo{font-weight:900;color:#ffc300;font-size:20px}
.search{margin-top:12px;background:#fff;border-radius:16px;padding:10px 14px;display:flex;gap:8px}
.search input{border:none;outline:none;flex:1}
.banner{margin:-50px 14px 10px;background:linear-gradient(135deg,#5a2dff,#8e4dff);border-radius:18px;padding:18px;color:#fff}
.banner button{background:#ffd500;border:none;padding:10px 18px;border-radius:12px;font-weight:800;margin-top:8px}
.cats{padding:10px 14px}.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center}
.cat-grid div{background:#fff;border-radius:14px;padding:10px 4px;box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer}
.products{padding:10px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.card img{width:100%;height:150px;object-fit:cover}
.card-body{padding:8px}.price{font-weight:900}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #eee}
.err{padding:10px;background:#ffe0e0;border-radius:8px;margin:10px 14px;color:red;font-size:13px}
</style>
</head>
<body>
<div class="top">
<div style="display:flex;justify-content:space-between"><div class="logo">REALITY<br>MALL</div><div>📍 Warri</div></div>
<div class="search">🔍 <input id="q" placeholder="Search products..." oninput="render()"></div>
</div>

<div class="banner">
<h2 style="margin:0">BIG MONTH SALE<br>Up to 60% OFF</h2>
<small>On Phones, Electronics & Fashion</small><br>
<button onclick="location.href='dashboard.html'">+ Post Product - Free</button>
</div>

<div id="supabaseErr" class="err" style="display:none"></div>

<div class="cats">
<div style="display:flex;justify-content:space-between"><h3>Categories</h3><span style="color:#c79b00">See all</span></div>
<div class="cat-grid">
<div onclick="filterCat('powerbank')">📱<br><small>Phones</small></div>
<div onclick="filterCat('fashion')">👕<br><small>Fashion</small></div>
<div onclick="filterCat('samsung')">💻<br><small>Electronics</small></div>
<div onclick="filterCat('nike')">🏠<br><small>Home</small></div>
<div onclick="filterCat('')">🥕<br><small>All</small></div>
</div>
</div>

<div class="products" id="products"></div>

<div class="nav">
<div onclick="location.href='index.html'">🏠<br>Home</div>
<div onclick="location.href='dashboard.html'">+<br>Post</div>
<div onclick="location.href='chat.html'">💬<br>Chat</div>
<div onclick="location.href='login.html'">👤<br>Login</div>
</div>

<script>
// PRODUCTS - Works even without Supabase! Uses phone storage
let defaultProducts=[
  {id:'1',shop_name:'Odera chidalu Vitalis',phone:'+2349078617514',content:'Oraimo Powerbank 20000mAh - Fast Charge',price:12500,image:'https://images.unsplash.com/photo-1609091839311-d5365f9ff1c5?w=400'},
  {id:'2',shop_name:'OC GLOBAL TECH',phone:'+2349078617514',content:'Samsung Earbuds Pro - Original',price:9800,image:'https://images.unsplash.com/photo-1572569511254-d8f925fe2cbb?w=400'},
  {id:'3',shop_name:'Warri Fashion',phone:'+2349078617514',content:'Nike Air Runner Sneakers - Size 42',price:25000,image:'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400'},
  {id:'4',shop_name:'Odera chidalu Vitalis',phone:'+2349078617514',content:'Looking happy - New Arrival',price:15000,image:'https://via.placeholder.com/400?text=Looking+Happy'}
];

function getProducts(){
  let saved = JSON.parse(localStorage.getItem('reality_products')||'[]');
  return [...saved, ...defaultProducts];
}

function render(){
 let q=document.getElementById('q').value.toLowerCase();
 let list=getProducts().filter(p=>p.content.toLowerCase().includes(q) || p.shop_name.toLowerCase().includes(q));
 document.getElementById('products').innerHTML=list.map(p=>`
  <div class="card" onclick="alert('Call seller: '+p.phone)">
  <img src="${p.image}" onerror="this.src='https://via.placeholder.com/400?text=REALITY+MALL'">
  <div class="card-body">
  <small style="color:#888">@${p.shop_name}</small>
  <div style="font-size:13px;font-weight:600">${p.content.slice(0,40)}</div>
  <div class="price">₦${(p.price||0).toLocaleString()}</div>
  <small style="color:green">📞 ${p.phone}</small>
  </div></div>`).join('');
}
function filterCat(c){document.getElementById('q').value=c; render()}

// Try Supabase but don't block if error
(async()=>{
 try{
  const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  const supa=createClient('https://trawtkndvzsplcmmtjox.supabase.co','sb_publishable_ACkUQyZDMHThA7SYE1ME2w_HMNjyIXg');
  let {data,error}=await supa.from('products').select('*').limit(20);
  if(error) throw error;
  if(data && data.length>0){
    localStorage.setItem('reality_products', JSON.stringify(data));
    render();
  }
 }catch(e){
  document.getElementById('supabaseErr').style.display='block';
  document.getElementById('supabaseErr').innerHTML='⚠️ Supabase Error: '+e.message+'<br>Showing offline products. Fix: Go to Supabase SQL Editor > Run: <b>alter table products disable row level security;</b>';
  console.log(e);
 }
})();

render();
</script>
</body>
</html>
