<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REALITY MALL - Warri No.1</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:Arial} body{margin:0;background:#f7f7f8;padding-bottom:80px}
.top{background:#0f1115;color:#fff;padding:14px 16px 70px;border-radius:0 0 24px 24px}
.logo{font-weight:900;color:#ffc300;font-size:20px}
.search{margin-top:12px;background:#fff;border-radius:16px;padding:10px 14px;display:flex;gap:8px}
.search input{border:none;outline:none;flex:1}
.banner{margin:-50px 14px 10px;background:linear-gradient(135deg,#5a2dff,#8e4dff);border-radius:18px;padding:18px;color:#fff}
.banner button{background:#ffd500;border:none;padding:10px 18px;border-radius:12px;font-weight:800;margin-top:8px}
.cats{padding:10px 14px}.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center}
.cat-grid div{background:#fff;border-radius:14px;padding:10px 4px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.products{padding:10px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.card img{width:100%;height:150px;object-fit:cover}
.card-body{padding:8px}.price{font-weight:900}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #eee}
</style>
</head>
<body>
<div class="top">
<div style="display:flex;justify-content:space-between;align-items:center"><div class="logo">REALITY<br>MALL</div><div>📍 Warri</div></div>
<div class="search">🔍 <input id="q" placeholder="Search products in Warri..." oninput="render()"></div>
</div>

<div class="banner">
<h2 style="margin:0">BIG MONTH SALE<br>Up to 60% OFF</h2>
<small>On Phones, Electronics & Fashion</small><br>
<button onclick="location.href='dashboard.html'">Shop Now →</button>
</div>

<div class="cats">
<div style="display:flex;justify-content:space-between"><h3>Categories</h3><span style="color:#c79b00">See all</span></div>
<div class="cat-grid">
<div onclick="filterCat('phones')">📱<br><small>Phones</small></div>
<div onclick="filterCat('fashion')">👕<br><small>Fashion</small></div>
<div onclick="filterCat('electronics')">💻<br><small>Electronics</small></div>
<div onclick="filterCat('home')">🏠<br><small>Home</small></div>
<div onclick="filterCat('groceries')">🥕<br><small>Groceries</small></div>
</div>
</div>

<div class="products" id="products">Loading products from Supabase...</div>

<div class="nav">
<div onclick="location.href='index.html'">🏠<br>Home</div>
<div onclick="location.href='dashboard.html'">+<br>Post</div>
<div onclick="location.href='chat.html'">💬<br>Chat</div>
<div onclick="location.href='login.html'">👤<br>Login</div>
</div>

<script>
const supa=supabase.createClient('https://trawtkndvzsplcmmtjox.supabase.co','sb_publishable_ACkUQyZDMHThA7SYE1ME2w_HMNjyIXg');
let allProducts=[
  {id:'1',shop_name:'Odera chidalu Vitalis',content:'Oraimo Powerbank 20000mAh',price:12500,image:'https://images.unsplash.com/photo-1609091839311-d5365f9ff1c5?w=400'},
  {id:'2',shop_name:'OC GLOBAL TECH',content:'Samsung Earbuds Pro',price:9800,image:'https://images.unsplash.com/photo-1572569511254-d8f925fe2cbb?w=400'},
  {id:'3',shop_name:'Warri Fashion',content:'Nike Air Runner Sneakers',price:25000,image:'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400'}
];

async function load(){
 try{
  let {data,error}=await supa.from('products').select('*').order('created_at',{ascending:false});
  if(!error && data && data.length>0) allProducts=data;
 }catch(e){console.log('Supabase error, using demo',e)}
 render();
}
function render(){
 let q=document.getElementById('q').value.toLowerCase();
 let list=allProducts.filter(p=>p.content.toLowerCase().includes(q) || p.shop_name.toLowerCase().includes(q));
 document.getElementById('products').innerHTML=list.map(p=>`
  <div class="card" onclick="location.href='product.html?id=${p.id}'">
  <img src="${p.image}">
  <div class="card-body">
  <small style="color:#888">@${p.shop_name}</small>
  <div style="font-size:13px">${p.content.slice(0,40)}</div>
  <div class="price">₦${(p.price||0).toLocaleString()}</div>
  </div></div>`).join('') || '<div style=grid-column:1/3;text-align:center;padding:20px> No products. <a href=dashboard.html>Post first product</a></div>';
}
function filterCat(c){document.getElementById('q').value=c; render()}
load();
</script>
</body>
</html>
