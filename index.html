<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>REALITY MALL</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#f8f8f6]">
<nav class="flex justify-between p-5 bg-black text-white sticky top-0"><b class="text-2xl">REALITY.</b><a href="dashboard.html" class="bg-white text-black px-5 py-2 rounded-full font-bold">+ Open Shop</a></nav>
<div class="text-center py-8 px-4 max-w-3xl mx-auto"><h1 class="text-5xl font-black">REALITY<br>MALL</h1><p class="mt-3 text-sm text-zinc-600">PH's viral business mall. Real shops, real products. Every product is a little ad. Pay to go viral: ₦2k Little, ₦5k Viral, ₦10k Super Viral TOP. Pay: Moniepoint/Opay 9078617514 Odera Chidalu Vitalis</p></div>
<div id="shops" class="grid grid-cols-2 md:grid-cols-4 gap-4 p-6 max-w-7xl mx-auto">Loading REALITY...</div>
<script>
const SUPA_URL = 'YOUR_PROJECT_URL_HERE';
const SUPA_KEY = 'sb_publishable_Faq5PVc7M_Qm___qo5qSwA_MW_hRWzI';
const supabase = window.supabase.createClient(SUPA_URL, SUPA_KEY);
async function load(){
  const { data, error } = await supabase.from('products').select('*').eq('status','approved').order('viral_score',{ascending:false});
  const div=document.getElementById('shops');
  if(error){ div.innerHTML='Fix Project URL! Error: '+error.message; return; }
  if(!data||data.length==0){ div.innerHTML='<p class="col-span-4 text-center py-20">No products yet. Be first!<br><a href="dashboard.html" class="bg-black text-white px-5 py-2 rounded-full mt-4 inline-block">Open Shop ₦2k</a></p>'; return; }
  div.innerHTML='';
  data.forEach(p=>{
    div.innerHTML+=`<div class="bg-white p-3 rounded-[20px] border ${p.plan=='elite'?'border-green-500 border-2':''}"><span class="text-[8px] font-black px-2 py-1 rounded-full ${p.plan=='elite'?'bg-green-500 text-white':p.plan=='pro'?'bg-yellow-400':'bg-zinc-200'}">${p.plan}</span><img src="${p.image}" class="h-32 w-full object-cover rounded-xl mt-2"><p class="font-bold text-sm mt-2 truncate">${p.name}</p><p class="text-[11px]">${p.shop_name}</p><p class="font-black">₦${p.price}</p><a href="https://wa.me/${p.whatsapp}" target="_blank" class="block bg-black text-white text-center p-2 rounded-full text-xs mt-2">Buy</a></div>`;
  });
}
load();
</script>
</body>
</html>
