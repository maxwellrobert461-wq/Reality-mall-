<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REALITY MALL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;margin:0;background:#fff}
.header{background:#000;color:#fff;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.feeds{display:flex;gap:8px;padding:10px;overflow:auto;white-space:nowrap;border-bottom:1px solid #eee;position:sticky;top:92px;background:#fff}
.feed-btn{padding:8px 18px;border-radius:20px;border:1px solid #ddd;background:#fff;font-weight:bold;cursor:pointer}
.feed-btn.active{background:#000;color:#fff}
.product-card{border-bottom:1px solid #eee;padding:15px}
.product-card img,.product-card video{width:100%;border-radius:10px;max-height:400px;object-fit:cover}
.price{color:green;font-weight:bold;font-size:18px}
.btn{padding:10px 15px;background:#000;color:#fff;border:none;border-radius:8px;width:100%;margin-top:8px;font-weight:bold}
.ad-box{background:#fffbe6;border:2px dashed #ffb400;padding:15px;text-align:center;border-radius:12px;margin:10px}
.ad-top{background:#000;color:#fff;padding:10px;text-align:center;position:sticky;top:52px;z-index:9}
</style>
</head>
<body>
<div class="header"><h2 style="margin:0">REALITY.</h2><div style="display:flex;gap:8px"><a href="invite.html" style="background:#25D366;color:#fff;padding:8px 12px;border-radius:20px;text-decoration:none;font-weight:bold">Invite</a><a href="dashboard.html" style="background:#fff;color:#000;padding:8px 15px;border-radius:20px;text-decoration:none;font-weight:bold">+ Post</a></div></div>
<div class="ad-top">🔥 AD SPACE: ₦5k/week → <a href="https://wa.me/2349078617514" style="color:#ffb400;font-weight:bold">Chat Now</a></div>
<div class="feeds">
<button class="feed-btn active" onclick="loadFeed('all',this)">Home</button>
<button class="feed-btn" onclick="loadFeed('shops',this)">Shops</button>
<button class="feed-btn" onclick="loadFeed('posts',this)">Posts</button>
<button class="feed-btn" onclick="loadFeed('video',this)">Video</button>
</div>
<div id="products" style="padding:10px"><p>Loading...</p></div>
<script>
const SUPABASE_URL='https://trawtkndvzsplcmmtjox.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_ACkUQyZDMHThA7SYE1ME2w_HMNjyIXg';
const client=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
async function loadFeed(type,btn){
 if(btn){document.querySelectorAll('.feed-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
 let q=client.from('products').select('*').order('created_at',{ascending:false}).eq('status','approved');
 if(type==='shops')q=q.eq('feed_type','shops'); if(type==='posts')q=q.eq('feed_type','posts'); if(type==='video')q=q.eq('feed_type','video');
 const {data,error}=await q;
 if(!data||!data.length){document.getElementById('products').innerHTML='<div class="ad-box"><small>SPONSORED</small><h3>Advertise Here!</h3><a href="https://wa.me/2349078617514"><button class="btn" style="background:#ffb400;color:#000">Buy Ad</button></a></div><p style="text-align:center;padding:20px">No posts yet.<br><a href="dashboard.html" style="background:#000;color:#fff;padding:12px 20px;border-radius:8px;text-decoration:none">+ Post Now</a></p>';return}
 let html=''; data.forEach((p,i)=>{
  if(i==1 || (i>0 && i%10==0)){
   html+=`<div class="ad-box"><small>SPONSORED AD - Every 10 posts</small><h3>🔥 Advertise Your Business - ₦5k/week</h3><p>Reach 10,000 Warri customers</p><a href="https://wa.me/2349078617514"><button class="btn" style="background:#ffb400;color:#000">Chat to Advertise</button></a></div>`;
  }
  const isBoosted=localStorage.getItem('boost_'+p.id);
  const boostBadge=isBoosted?`<span style="background:#ffb400;color:#000;padding:4px 10px;border-radius:15px;font-size:12px;font-weight:bold">🔥 BOOSTED - ${JSON.parse(isBoosted).price==1000?'400':JSON.parse(isBoosted).price==3000?'1500':'UNLIMITED'} Views</span>`:'';  
  const isVideo=p.image&&p.image.includes('.mp4')||p.feed_type==='video';
  const media=isVideo?`<video src="${p.image}" controls></video>`:`<img src="${p.image||''}">`;
  const price=p.feed_type==='shops'?`<p class="price">₦${(p.price||0).toLocaleString()}</p>`:'';
  html+=`<div class="product-card" style="${isBoosted?'border:2px solid #ffb400;background:#fffbe6':''}">${boostBadge}${media}<h3>${p.shop_name||''}</h3><p>${p.content||p.name||''}</p>${price}<p>${p.views||0} views</p><a href="https://wa.me/${p.whatsapp}?text=Hi, I saw your post on REALITY MALL" target="_blank"><button class="btn">Chat on WhatsApp</button></a><a href="boost.html?id=${p.id}"><button class="btn" style="background:#fff;color:#000;border:2px solid #000">🚀 Boost Post - ₦1k for 400 views, ₦3k for 1500, ₦5k Unlimited 7 days</button></a></div>`;
 });
 document.getElementById('products').innerHTML=html;
}
loadFeed('all');
</script>
</body>
</html>
