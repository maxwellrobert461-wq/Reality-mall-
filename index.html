<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REALITY MALL - Shops</title>
<style>
*{box-sizing:border-box;font-family:Arial} body{margin:0;background:#f5f6f8;padding-bottom:70px}
.top{padding:10px 14px;background:#fff;position:sticky;top:0;z-index:10}
.search{display:flex;gap:8px}.search input{flex:1;padding:12px;border-radius:24px;border:1px solid #ddd;background:#f0f2f5}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 14px}.tab{padding:8px 18px;border-radius:20px;border:none;background:#e4e6eb;font-weight:600}.tab.active{background:#0d63f2;color:#fff}
.shops{padding:0 10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border-radius:16px;overflow:hidden;padding:0 0 10px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card img.prod{width:100%;height:120px;object-fit:cover;background:#eee}
.card.info{padding:8px}.stars{color:#ffb400;font-size:12px}.price{font-size:12px;margin:2px 0}
.btn{width:90%;margin:6px 5%;padding:8px;background:#0d63f2;color:#fff;border:none;border-radius:20px;font-weight:700}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #ddd}
.nav div{text-align:center;font-size:11px}.nav.active{color:#0d63f2}
</style>
</head><body>
<div class="top">
<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="color:#0d3c9c;margin:0">Shops</h2><div style="display:flex;gap:14px">🔍 💬 🔔</div></div>
<div class="search" style="margin-top:10px"><input id="q" placeholder="Search shops, products, categories..." oninput="render()"></div>
</div>
<div class="tabs">
<button class="tab active" onclick="filterCat('')">All</button>
<button class="tab" onclick="filterCat('fashion')">Fashion</button>
<button class="tab" onclick="filterCat('electronics')">Electronics</button>
</div>
<div style="padding:0 14px;display:flex;justify-content:space-between"><h3 style="margin:6px 0">Shops</h3><small id="count">12 shops found</small></div>
<div id="shops" class="shops"></div>
<div class="nav">
<div class="active">🏠<br>Home</div><div onclick="location.href='shop.html'">🛍️<br>Shop</div><div onclick="location.href='dashboard.html'" style="background:#000;color:#fff;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px">+</div><div onclick="location.href='chat.html'">✉️<br>Inbox</div><div onclick="location.href='wallet.html'">👤<br>Wallet</div>
</div>
<script>
let data=[
 {name:'Odera Fashion',img:'https://images.unsplash.com/photo-1551232864-3f0890e580d9?w=300',prod:'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=300',rating:'4.8 (128 reviews)',priceN:'₦15,000 NGN',priceG:'GH₵120 GHS',priceU:'$20 USD'},
 {name:'OC GLOBAL TECH',img:'https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?w=300',prod:'https://images.unsplash.com/photo-1609091839311-d5365f9ff1c5?w=300',rating:'4.8 (96 reviews)',priceN:'₦12,500 NGN',priceG:'GH₵98 GHS',priceU:'$16 USD'},
 {name:'Warri Gadgets',img:'https://images.unsplash.com/photo-1572569511254-d8f925fe2cbb?w=300',prod:'https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=300',rating:'4.9 (310 reviews)',priceN:'₦9,800 NGN',priceG:'GH₵75 GHS',priceU:'$13 USD'},
 {name:'Reality Mall Official',img:'https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=300',prod:'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=300',rating:'4.9 (2k reviews)',priceN:'₦27,000 NGN',priceG:'GH₵210 GHS',priceU:'$35 USD'},
];
function render(){
 let q=document.getElementById('q').value.toLowerCase();
 let list=data.filter(d=>d.name.toLowerCase().includes(q));
 document.getElementById('count').innerText=list.length+' shops found';
 document.getElementById('shops').innerHTML=list.map(d=>`
  <div class="card" onclick="location.href='shop.html?name=${d.name}'">
  <img class="prod" src="${d.prod}">
  <div class="info">
  <div style="display:flex;align-items:center;gap:6px"><img src="https://i.pravatar.cc/30" style="border-radius:50%"><b>${d.name}</b> <span style="color:#0d63f2">✔️</span></div>
  <div class="stars">⭐⭐⭐⭐⭐ ${d.rating}</div>
  <div class="price">🇳🇬 ${d.priceN} <small style="color:#888">Naira</small></div>
  <div class="price">🇬🇭 ${d.priceG} <small style="color:#888">GHS Cedi</small></div>
  <div class="price">🇺🇸 ${d.priceU} <small style="color:#888">USD Dollar</small></div>
  </div>
  <button class="btn">Visit Shop</button>
  </div>`).join('');
}
function filterCat(c){document.getElementById('q').value=c; render()}
render();
</script>
</body></html>
