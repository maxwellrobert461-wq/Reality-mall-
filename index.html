<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shops - REALITY MALL</title>
<style>
*{box-sizing:border-box;font-family:Arial} body{margin:0;background:#f5f6f8;padding-bottom:75px}
.top{padding:10px 14px;background:#fff;position:sticky;top:0;z-index:10;border-bottom:1px solid #eee}
.icons{display:flex;gap:14px;font-size:22px}
.icons span{cursor:pointer;padding:6px;background:#f0f2f5;border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.icons span:active{background:#0d63f2;color:#fff}
.searchBox{margin-top:10px;position:relative}
.searchBox input{width:100%;padding:12px 12px 12px 40px;border-radius:24px;border:1px solid #ddd;background:#f0f2f5;font-size:14px}
.searchBox:before{content:'🔍';position:absolute;left:12px;top:12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 14px}.tab{padding:8px 18px;border-radius:20px;border:none;background:#e4e6eb;font-weight:600;white-space:nowrap}.tab.active{background:#0d63f2;color:#fff}
.shops{padding:0 10px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);position:relative}
.card img.prod{width:100%;height:130px;object-fit:cover;background:#eee}
.badge{position:absolute;top:8px;right:8px;background:#0d63f2;color:#fff;font-size:10px;padding:4px 8px;border-radius:12px;font-weight:800}
.btn{width:90%;margin:8px 5%;padding:9px;background:#0d63f2;color:#fff;border:none;border-radius:20px;font-weight:700}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #eee;z-index:20}
.nav div{text-align:center;font-size:11px;cursor:pointer;padding:4px 12px;border-radius:12px}.nav div.active{color:#0d63f2;background:#eef3ff}
.add{width:52px;height:52px;background:#000;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin-top:-20px;border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.2)}
</style>
</head><body>

<div class="top">
<div style="display:flex;justify-content:space-between;align-items:center">
<h2 style="color:#0d3c9c;margin:0">Shops</h2>
<div class="icons">
<span onclick="doSearch()" title="Search">🔍</span>
<span onclick="openInbox()" title="Inbox Chat">💬</span>
<span onclick="openNotify()" title="Notifications">🔔</span>
</div>
</div>
<div class="searchBox"><input id="q" placeholder="Search shops, products, categories..." oninput="render()" onclick="doSearch()"></div>
</div>

<div class="tabs">
<button class="tab active" onclick="filterCat('')">All</button>
<button class="tab" onclick="filterCat('fashion')">Fashion</button>
<button class="tab" onclick="filterCat('tech')">Electronics</button>
<button class="tab" onclick="filterCat('warri')">Warri</button>
</div>

<div style="padding:0 14px;display:flex;justify-content:space-between;align-items:center"><h3 style="margin:6px 0">Shops</h3><small id="count">4 shops found • NGN / GHS / USD</small></div>

<div id="shops" class="shops"></div>

<!-- Notifications Popup -->
<div id="notifyBox" style="display:none;position:fixed;top:60px;right:10px;background:#fff;width:300px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:50;padding:14px">
<div style="display:flex;justify-content:space-between"><b>Notifications</b><span onclick="document.getElementById('notifyBox').style.display='none'" style="cursor:pointer">✕</span></div>
<hr>
<div style="padding:8px 0">🔵 <b>Odera Fashion</b> posted new shoe - ₦15,000</div>
<div style="padding:8px 0">🟢 <b>OC GLOBAL TECH</b> - Your verification ₦10,000 successful!</div>
<div style="padding:8px 0">🔔 <b>Warri Gadgets</b> - 12 new views boosted</div>
<button onclick="location.href='wallet.html'" style="width:100%;margin-top:8px;padding:10px;background:#0d63f2;color:#fff;border:none;border-radius:10px">View Wallet</button>
</div>

<div class="nav">
<div class="active" onclick="location.href='index.html'">🏠<br>Home</div>
<div onclick="location.href='shop.html'">🛍️<br>Shop</div>
<div class="add" onclick="location.href='post.html'">+</div>
<div onclick="openInbox()">✉️<br>Inbox</div>
<div onclick="location.href='wallet.html'">👤<br>Wallet</div>
</div>

<script>
let data=[
 {name:'Odera Fashion',cat:'fashion',prod:'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400',priceN:'₦15,000',priceG:'GH₵120',priceU:'$20',rate:'4.8 (128 reviews)',badge:'Warri'},
 {name:'OC GLOBAL TECH',cat:'tech',prod:'https://images.unsplash.com/photo-1525598912003-663126343e1f?w=400',priceN:'₦12,500',priceG:'GH₵98',priceU:'$16',rate:'4.8 (96 reviews)',badge:'Verified'},
 {name:'Warri Gadgets',cat:'warri',prod:'https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=400',priceN:'₦9,800',priceG:'GH₵75',priceU:'$13',rate:'4.9 (310 reviews)',badge:'New'},
 {name:'Reality Mall Official',cat:'fashion',prod:'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=400',priceN:'₦27,000',priceG:'GH₵210',priceU:'$35',rate:'4.9 (2k reviews)',badge:'Official'},
];
function render(){
 let q=document.getElementById('q').value.toLowerCase();
 let list=data.filter(d=>d.name.toLowerCase().includes(q) || d.cat.includes(q));
 document.getElementById('count').innerText=list.length+' shops found • NGN / GHS / USD';
 document.getElementById('shops').innerHTML=list.map(d=>`
  <div class="card" onclick="location.href='shop.html?name=${encodeURIComponent(d.name)}'">
  <span class="badge">${d.badge}</span>
  <img class="prod" src="${d.prod}">
  <div style="padding:8px">
  <div style="display:flex;gap:6px;align-items:center"><img src="https://i.pravatar.cc/24?img=${Math.floor(Math.random()*20)+1}" style="border-radius:50%"><b style="font-size:14px">${d.name}</b><span style="color:#0d63f2">✔️</span></div>
  <div style="color:#ffb400;font-size:12px">⭐⭐⭐⭐⭐ ${d.rate}</div>
  <div style="font-size:12px;margin-top:4px">🇳🇬 ${d.priceN} NGN</div>
  <div style="font-size:12px">🇬🇭 ${d.priceG} GHS Cedi</div>
  <div style="font-size:12px">🇺🇸 ${d.priceU} USD</div>
  </div>
  <button class="btn" onclick="event.stopPropagation(); location.href='shop.html?name=${encodeURIComponent(d.name)}'">Visit Shop</button>
  </div>`).join('');
}
function filterCat(c){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active')); event.target.classList.add('active'); document.getElementById('q').value=c; render();}
function doSearch(){document.getElementById('q').focus(); document.getElementById('q').style.border='2px solid #0d63f2';}
function openInbox(){location.href='chat.html';}
function openNotify(){
 let b=document.getElementById('notifyBox');
 b.style.display=b.style.display=='none'?'block':'none';
}
render();
</script>
</body></html>
