<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat - Fixed</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4813832175831420" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box;font-family:Arial;margin:0}
body{background:#e5ddd5;height:100vh;display:flex;flex-direction:column}
.top{background:#f0f2f5;padding:10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #ccc;position:sticky;top:0;z-index:10}
.msgs{flex:1;overflow-y:auto;padding:10px;padding-bottom:20px}
.bubble{max-width:80%;padding:10px 12px;border-radius:12px;margin:6px 0;font-size:15px;line-height:1.3}
.me{background:#dcf8c6;margin-left:auto;border-bottom-right-radius:2px}
.other{background:#fff;margin-right:auto;border-bottom-left-radius:2px}
.bar{background:#f0f2f5;padding:8px;display:flex;align-items:center;gap:6px;position:sticky;bottom:0}
.bar input{flex:1;padding:12px 16px;border-radius:22px;border:none;outline:none;font-size:15px;background:#fff}
.btn{width:44px;height:44px;border-radius:50%;border:none;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.send{background:#0084ff;color:#fff}.mic{background:#00a884;color:#fff}.attach{background:#fff;border:1px solid #ddd}
</style></head><body>

<div class="top">
<span onclick="location.href='chat.html'" style="font-size:28px;cursor:pointer">←</span>
<div style="width:38px;height:38px;border-radius:50%;background:#0d63f2;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800" id="av">W</div>
<div style="flex:1"><b id="name">Chat</b><div style="font-size:11px;color:#008069" id="stat">Online - Text works now!</div></div>
<button onclick="if(confirm('Clear chat?')){localStorage.removeItem('chat_'+chatName);render()}" style="padding:6px 12px;border-radius:20px;border:1px solid #ddd;background:#fff;font-size:12px">Clear</button>
</div>

<div class="msgs" id="msgs"></div>

<div class="bar">
<button class="btn attach" onclick="document.getElementById('fileIn').click()">📎</button>
<input type="file" id="fileIn" accept="image/*" style="display:none">
<input id="txtIn" type="text" placeholder="Type a message...">
<button class="btn mic" id="micBtn">🎤</button>
<button class="btn send" id="sendBtn">➤</button>
</div>

<script>
let params=new URLSearchParams(location.search);
let chatName=params.get('name')?decodeURIComponent(params.get('name')):(localStorage.getItem('currentChat')||'Warri Sellers Group');
document.getElementById('name').innerText=chatName;
document.getElementById('av').innerText=chatName.charAt(0).toUpperCase();
let KEY='chat_'+chatName;

function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}
function save(a){try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){alert('Storage full! Tap Clear to delete old chats');}}

function render(){
let arr=load();
let html='';
for(let i=0;i<arr.length;i++){
let m=arr[i];
if(m.t==='txt'){
html+=`<div class="bubble ${m.me?'me':'other'}">${m.msg}<div style="font-size:10px;color:#667781;text-align:right;margin-top:4px">${m.time} ${m.me?'✔️✔️':''}</div></div>`;
}else if(m.t==='img'){
html+=`<div class="bubble ${m.me?'me':'other'}"><img src="${m.data}" style="max-width:200px;border-radius:8px;display:block"><div style="font-size:10px;color:#667781;text-align:right;margin-top:4px">${m.time}</div></div>`;
}else if(m.t==='voice'){
html+=`<div class="bubble ${m.me?'me':'other'}" style="min-width:200px"><div style="font-size:12px;font-weight:700">🎤 Voice ${m.dur||''}</div><audio controls src="${m.data}" style="width:200px;margin-top:6px"></audio><div style="font-size:10px;color:#667781;text-align:right">${m.time}</div></div>`;
}
}
let msgsDiv=document.getElementById('msgs');
msgsDiv.innerHTML=html||`<div style="background:#fff;margin:20px;padding:20px;border-radius:12px;text-align:center;color:#666"><div style="font-size:40px">💬</div><b>${chatName}</b><br><small>Private chat - Only you and seller</small><br><br><div style="text-align:left;background:#f0f2f5;padding:10px;border-radius:8px;font-size:13px">✅ Text FIXED - Type and tap ➤ to send<br>✅ Picture - Tap 📎<br>✅ Voice - HOLD 🎤 2 sec then release<br><br>Type "Hi" now and tap blue ➤ - It will appear!</div></div>`;
msgsDiv.scrollTop=msgsDiv.scrollHeight;
}

function sendTextNow(){
let inp=document.getElementById('txtIn');
let txt=inp.value.trim();
if(!txt){return;}
let arr=load();
arr.push({t:'txt',msg:txt,me:true,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});
save(arr);
inp.value='';
render();
// Auto reply
setTimeout(()=>{
let a=load();
a.push({t:'txt',msg:'Thanks! Seller will reply soon...',me:false,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});
save(a);render();
},800);
}

// FIXED - Both click and touch work
document.getElementById('sendBtn').onclick=sendTextNow;
document.getElementById('txtIn').addEventListener('keydown',function(e){
if(e.key==='Enter'){e.preventDefault();sendTextNow();}
});

// Image
document.getElementById('fileIn').addEventListener('change',function(){
if(!this.files[0])return;
let r=new FileReader();
r.onload=function(ev){
let arr=load();
arr.push({t:'img',data:ev.target.result,[STRIPPED] Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});
save(arr);render();
};
r.readAsDataURL(this.files[0]);
});

// Voice - HOLD to record
let rec=null,chunks=[],recording=false,start=0,streamRef=null;
let micBtn=document.getElementById('micBtn');

function getMime(){
if(MediaRecorder.isTypeSupported('audio/webm;codecs=opus'))return 'audio/webm;codecs=opus';
if(MediaRecorder.isTypeSupported('audio/webm'))return 'audio/webm';
if(MediaRecorder.isTypeSupported('audio/mp4'))return 'audio/mp4';
return 'audio/webm';
}

async function startRec(e){
if(e)e.preventDefault();
if(recording)return;
try{
let stream=await navigator.mediaDevices.getUserMedia({audio:true});
streamRef=stream;
let mime=getMime();
rec=new MediaRecorder(stream,{mimeType:mime});
chunks=[];start=Date.now();recording=true;
rec.ondataavailable=ev=>{if(ev.data.size>0)chunks.push(ev.data);};
rec.onstop=()=>{
let blob=new Blob(chunks,{type:mime});
if(blob.size<600){alert('Hold longer! At least 1 second');if(streamRef)streamRef.getTracks().forEach(t=>t.stop());resetMic();return;}
let reader=new FileReader();
reader.onload=ev2=>{
let dur=Math.round((Date.now()-start)/1000)+'s';
let arr=load();
arr.push({t:'voice',data:ev2.target.result,[STRIPPED] Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),dur:dur});
save(arr);render();
if(streamRef)streamRef.getTracks().forEach(t=>t.stop());
resetMic();
};
reader.readAsDataURL(blob);
};
rec.start();
micBtn.style.background='#ff0000';
micBtn.innerText='🔴';
document.getElementById('stat').innerText='🔴 Recording... Release to send';
document.getElementById('stat').style.color='red';
}catch(err){alert('Allow mic: '+err.message);resetMic();}
}

function stopRec(e){if(e)e.preventDefault();if(recording&&rec&&rec.state==='recording'){rec.stop();}else{resetMic();}}

function resetMic(){recording=false;micBtn.style.background='#00a884';micBtn.innerText='🎤';document.getElementById('stat').innerText='HOLD 🎤 2 sec to record voice';document.getElementById('stat').style.color='#008069';}

micBtn.addEventListener('pointerdown',startRec);
micBtn.addEventListener('pointerup',stopRec);
micBtn.addEventListener('pointerleave',stopRec);
micBtn.addEventListener('touchstart',e=>{e.preventDefault();startRec(e);},{passive:false});
micBtn.addEventListener('touchend',e=>{e.preventDefault();stopRec(e);},{passive:false});

render();
</script></body></html>
