<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat Room</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4813832175831420" crossorigin="anonymous"></script>
<style>*{box-sizing:border-box;font-family:Arial} body{margin:0;background:#e5ddd5;display:flex;flex-direction:column;height:100vh}
.top{background:#f0f2f5;padding:10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #ddd}
.msgs{flex:1;overflow-y:auto;padding:10px}
.bubble{max-width:75%;padding:8px 12px;border-radius:12px;margin:6px 0;font-size:14px}
.me{background:#dcf8c6;margin-left:auto}.other{background:#fff;margin-right:auto}
.inputArea{background:#f0f2f5;padding:8px;display:flex;gap:8px;align-items:center}
.inputArea input{flex:1;padding:12px;border-radius:24px;border:1px solid #ddd;outline:none}
.btn{width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;font-size:18px}
.send{background:#0d63f2;color:#fff}.mic{background:#25d366;color:#fff}
</style></head><body>
<div class="top"><span onclick="history.back()" style="font-size:22px">←</span><div id="av" style="width:36px;height:36px;border-radius:50%;background:#0d63f2;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800">W</div><div style="flex:1"><b id="name">Chat</b><div style="font-size:11px;color:#666" id="status">Online - Private chat, only you can see</div></div></div>
<div class="msgs" id="msgs"></div>
<div class="inputArea">
<button class="btn" style="background:#fff" onclick="document.getElementById('fileInp').click()">📎</button>
<input type="file" id="fileInp" accept="image/*" style="display:none" onchange="sendFile(this)">
<input id="msgInput" placeholder="Type message..." onkeypress="if(event.key==='Enter')sendText()">
<button class="btn mic" id="micBtn" onmousedown="startRec()" onmouseup="stopRec()" ontouchstart="startRec()" ontouchend="stopRec()">🎤</button>
<button class="btn send" onclick="sendText()">➤</button>
</div>
<script>
let chatName=decodeURIComponent(new URLSearchParams(location.search).get('name')||localStorage.getItem('currentChat')||'Warri Sellers Group');
document.getElementById('name').innerText=chatName; document.getElementById('av').innerText=chatName[0].toUpperCase();
let key='chat_'+chatName;
function getC(){return JSON.parse(localStorage.getItem(key)||'[]')} function saveC(a){localStorage.setItem(key,JSON.stringify(a))}
function render(){let arr=getC();let h='';for(let i=0;i<arr.length;i++){let m=arr[i];if(m.type=='text')h+=`<div class="bubble ${m.me?'me':'other'}">${m.text}<div style="font-size:10px;color:#888;text-align:right">${m.time}</div></div>`;else if(m.type=='image')h+=`<div class="bubble ${m.me?'me':'other'}"><img src="${m.data}" style="max-width:200px;border-radius:8px"><div style="font-size:10px">${m.time}</div></div>`;else if(m.type=='voice')h+=`<div class="bubble ${m.me?'me':'other'}"><audio controls src="${m.data}" style="width:180px"></audio><div style="font-size:10px">${m.time}</div></div>`;}
document.getElementById('msgs').innerHTML=h||'<div style="text-align:center;color:#888;margin-top:30px">🔒 Private chat<br>Only you and '+chatName+'<br><br>Send voice note: Hold 🎤<br>Send picture: Tap 📎</div>';document.getElementById('msgs').scrollTop=99999;}
function sendText(){let inp=document.getElementById('msgInput');let txt=inp.value.trim();if(!txt)return;let arr=getC();arr.push({type:'text',text:txt,me:true,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});saveC(arr);inp.value='';render();setTimeout(()=>{let a=getC();a.push({type:'text',text:'Thanks! Seller will reply soon...',me:false,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});saveC(a);render();},1000);}
function sendFile(inp){let r=new FileReader();r.onload=e=>{let arr=getC();arr.push({type:'image',data:e.target.result,me:true,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});saveC(arr);render();};r.readAsDataURL(inp.files[0]);}
let rec, chunks=[]; async function startRec(){document.getElementById('status').innerText='🔴 Recording... Hold to record';document.getElementById('micBtn').style.background='#f00';try{let s=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(s);chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{let blob=new Blob(chunks,{type:'audio/webm'});let rd=new FileReader();rd.onload=e2=>{let arr=getC();arr.push({type:'voice',data:e2.target.result,me:true,time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});saveC(arr);render();};rd.readAsDataURL(blob);};rec.start();}catch(e){alert('Allow microphone!')}} function stopRec(){if(rec&&rec.state=='recording'){rec.stop();document.getElementById('micBtn').style.background='#25d366';document.getElementById('status').innerText='Online';}}
render();
</script></body></html>
