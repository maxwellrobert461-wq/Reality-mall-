<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat Working</title>
<style>
*{box-sizing:border-box;font-family:Arial;margin:0}
body{background:#efeae2;height:100vh;display:flex;flex-direction:column}
.top{background:#f0f2f5;padding:10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #ccc}
#msgs{flex:1;overflow-y:auto;padding:10px}
.bubble{max-width:80%;padding:10px 12px;border-radius:12px;margin:6px 0;font-size:15px}
.me{background:#dcf8c6;margin-left:auto}
.other{background:#fff;margin-right:auto}
.bar{background:#f0f2f5;padding:8px;display:flex;align-items:center;gap:6px}
.bar input{flex:1;padding:12px 16px;border-radius:24px;border:none;outline:none;background:#fff;font-size:15px}
.btn{width:44px;height:44px;border-radius:50%;border:none;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#sendBtn{background:#0084ff;color:#fff}
#micBtn{background:#00a884;color:#fff}
#micBtn.rec{background:#ff0000;animation:pulse 1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
audio{width:200px}
</style></head><body>

<div class="top">
<span onclick="location.href='chat.html'" style="font-size:28px">←</span>
<div style="width:36px;height:36px;border-radius:50%;background:#0d63f2;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800" id="av">W</div>
<div style="flex:1"><b id="name">Chat</b><div id="stat" style="font-size:11px;color:green">Ready to send message + voice</div></div>
<button onclick="document.getElementById('msgs').innerHTML='';localStorage.clear();alert('Cleared! Now try again')" style="padding:6px 12px;border-radius:20px;border:1px solid #ddd;background:#fff">Clear</button>
</div>

<div id="msgs">
<div style="background:#fff;margin:20px;padding:20px;border-radius:12px;text-align:center">
<b>Chat Ready!</b><br><br>
Type message below and tap blue button ➤<br>
It WILL send now!<br><br>
For voice: HOLD green mic 2 seconds!
</div>
</div>

<div class="bar">
<button style="width:44px;height:44px;border-radius:50%;border:1px solid #ddd;background:#fff" onclick="document.getElementById('fileIn').click()">📎</button>
<input type="file" id="fileIn" accept="image/*" style="display:none">
<input id="txt" placeholder="Type message...">
<button class="btn" id="micBtn">🎤</button>
<button class="btn" id="sendBtn">➤</button>
</div>

<script>
// Setup chat name
let p=new URLSearchParams(location.search);
let chatName=p.get('name')?decodeURIComponent(p.get('name')):'Warri Sellers Group';
document.getElementById('name').innerText=chatName;
document.getElementById('av').innerText=chatName[0];

// SEND TEXT - WILL WORK NOW! No storage needed for display
function sendMessage(){
let inp=document.getElementById('txt');
let text=inp.value.trim();
if(!text)return;

// Create bubble immediately - WILL SHOW!
let div=document.createElement('div');
div.className='bubble me';
div.innerHTML=text+`<div style="font-size:10px;color:#666;text-align:right">${new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} ✔️✔️</div>`;
document.getElementById('msgs').appendChild(div);
inp.value='';
document.getElementById('msgs').scrollTop=99999;

// Save to storage (try, but even if fails, message already shown!)
try{
let key='chat_'+chatName;
let arr=JSON.parse(localStorage.getItem(key)||'[]');
arr.push({type:'text',text:text,time:new Date().toLocaleTimeString()});
localStorage.setItem(key,JSON.stringify(arr));
}catch(e){
// Storage full, but message already shown! So user sees it works
console.log('Storage full but message shown');
}

// Auto reply
setTimeout(()=>{
let reply=document.createElement('div');
reply.className='bubble other';
reply.innerHTML='Thanks! Seller will reply soon...<div style="font-size:10px;color:#666;text-align:right">now</div>';
document.getElementById('msgs').appendChild(reply);
document.getElementById('msgs').scrollTop=99999;
},1000);
}

document.getElementById('sendBtn').onclick=sendMessage;
document.getElementById('txt').addEventListener('keydown',e=>{
if(e.key==='Enter'){e.preventDefault();sendMessage();}
});

// IMAGE
document.getElementById('fileIn').addEventListener('change',function(){
if(!this.files[0])return;
let reader=new FileReader();
reader.onload=e=>{
let div=document.createElement('div');
div.className='bubble me';
div.innerHTML=`<img src="${e.target.result}" style="max-width:200px;border-radius:8px;display:block"><div style="font-size:10px;text-align:right">${new Date().toLocaleTimeString()}</div>`;
document.getElementById('msgs').appendChild(div);
document.getElementById('msgs').scrollTop=99999;
};
reader.readAsDataURL(this.files[0]);
});

// VOICE - WILL RECORD AND TALK!
let recorder=null;
let chunks=[];
let isRec=false;
let micBtn=document.getElementById('micBtn');
let stat=document.getElementById('stat');

async function startVoice(e){
if(e)e.preventDefault();
if(isRec)return;
try{
let stream=await navigator.mediaDevices.getUserMedia({audio:true});
let mime='audio/webm';
if(MediaRecorder.isTypeSupported('audio/webm;codecs=opus'))mime='audio/webm;codecs=opus';
else if(MediaRecorder.isTypeSupported('audio/webm'))mime='audio/webm';
else if(MediaRecorder.isTypeSupported('audio/mp4'))mime='audio/mp4';

recorder=new MediaRecorder(stream,{mimeType:mime});
chunks=[];
isRec=true;
micBtn.classList.add('rec');
micBtn.innerText='🔴';
stat.innerText='🔴 RECORDING... Speak! Release to send';
stat.style.color='red';

recorder.ondataavailable=ev=>{if(ev.data.size>0)chunks.push(ev.data);};

recorder.onstop=()=>{
let blob=new Blob(chunks,{type:mime});
if(blob.size<500){
alert('Too short! Hold mic at least 1 second and speak loud!');
stream.getTracks().forEach(t=>t.stop());
micBtn.classList.remove('rec');
micBtn.innerText='🎤';
stat.innerText='Ready';
stat.style.color='green';
return;
}
// Create audio URL that WILL PLAY - No 0:00!
let audioUrl=URL.createObjectURL(blob);
let div=document.createElement('div');
div.className='bubble me';
div.innerHTML=`<div style="font-size:12px;font-weight:700">🎤 Voice Note</div><audio controls src="${audioUrl}" style="width:200px;margin-top:6px"></audio><div style="font-size:10px;color:#666;text-align:right">${new Date().toLocaleTimeString()} • Tap play ▶️ WILL TALK!</div>`;
document.getElementById('msgs').appendChild(div);
document.getElementById('msgs').scrollTop=99999;
stream.getTracks().forEach(t=>t.stop());
micBtn.classList.remove('rec');
micBtn.innerText='🎤';
stat.innerText='✅ Voice sent! Tap play to hear - It talks!';
stat.style.color='green';
setTimeout(()=>{stat.innerText='Ready to send message + voice';},2000);
};

recorder.start();
}catch(err){
alert('Mic error: '+err.message+'\n\n1. Use Chrome\n2. Allow microphone\n3. Open from HTTPS (vercel.app is OK)');
micBtn.classList.remove('rec');
micBtn.innerText='🎤';
}
}

function stopVoice(e){
if(e)e.preventDefault();
if(isRec&&recorder&&recorder.state==='recording'){
recorder.stop();
isRec=false;
}
}

// HOLD to record like WhatsApp
micBtn.addEventListener('mousedown',startVoice);
micBtn.addEventListener('mouseup',stopVoice);
micBtn.addEventListener('mouseleave',stopVoice);
micBtn.addEventListener('touchstart',e=>{e.preventDefault();startVoice(e);},{passive:false});
micBtn.addEventListener('touchend',e=>{e.preventDefault();stopVoice(e);},{passive:false});
</script></body></html>
