<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat Room - Working Voice</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4813832175831420" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box;font-family:Arial;margin:0} body{background:#e5ddd5;display:flex;flex-direction:column;height:100vh}
.top{background:#f0f2f5;padding:10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #ddd}
.msgs{flex:1;overflow-y:auto;padding:10px 8px}
.bubble{max-width:85%;padding:8px 10px;border-radius:12px;margin:5px 0;font-size:14px;word-wrap:break-word}
.me{background:#dcf8c6;margin-left:auto}
.other{background:#fff;margin-right:auto}
.inputBar{background:#f0f2f5;padding:8px;display:flex;align-items:center;gap:6px}
.inputBar input{flex:1;padding:12px 16px;border-radius:24px;border:1px solid #ddd;outline:none;font-size:15px}
.btn{width:44px;height:44px;border-radius:50%;border:none;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.send{background:#0084ff;color:#fff}.mic{background:#00a884;color:#fff}.attach{background:#fff}
audio{width:200px;height:36px;display:block;margin-top:4px}
</style></head><body>

<div class="top">
<span onclick="location.href='chat.html'" style="font-size:26px;padding:4px;cursor:pointer">←</span>
<div style="width:36px;height:36px;border-radius:50%;background:#0d63f2;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800" id="av">W</div>
<div style="flex:1"><b id="cName">Chat</b><div id="cStatus" style="font-size:11px;color:#008069">Online - HOLD 🎤 to record</div></div>
<button onclick="clearAll()" style="padding:6px 10px;border-radius:16px;border:1px solid #ddd;background:#fff;font-size:12px">🗑️ Clear</button>
</div>

<div class="msgs" id="msgs"></div>

<div class="inputBar">
<button class="btn attach" onclick="document.getElementById('fileIn').click()">📎</button>
<input type="file" id="fileIn" accept="image/*" style="display:none" onchange="sendImage(this)">
<input id="txtIn" placeholder="Type message..." onkeydown="if(event.key==='Enter')sendText()">
<button class="btn mic" id="micBtn">🎤</button>
<button class="btn send" onclick="sendText()">➤</button>
</div>

<script>
// Get chat name
let chatName = new URLSearchParams(location.search).get('name');
if(chatName) chatName = decodeURIComponent(chatName);
else chatName = localStorage.getItem('currentChat') || 'Warri Sellers Group';
document.getElementById('cName').innerText = chatName;
document.getElementById('av').innerText = chatName[0].toUpperCase();

let storageKey = 'chat_' + chatName;

function getMsgs(){
  try{ return JSON.parse(localStorage.getItem(storageKey) || '[]'); }catch(e){ return []; }
}
function saveMsgs(a){ localStorage.setItem(storageKey, JSON.stringify(a)); }

function clearAll(){
  if(confirm('Delete all messages including 0:00 voices?')){
    localStorage.removeItem(storageKey);
    render();
  }
}

function render(){
  let arr = getMsgs();
  let html = '';
  for(let i=0;i<arr.length;i++){
    let m = arr[i];
    if(m.type === 'text'){
      html += `<div class="bubble ${m.me?'me':'other'}">${m.text}<div style="font-size:10px;color:#666;text-align:right;margin-top:3px">${m.time}</div></div>`;
    }else if(m.type === 'image'){
      html += `<div class="bubble ${m.me?'me':'other'}"><img src="${m.data}" style="max-width:200px;border-radius:8px;display:block"><div style="font-size:10px;color:#666;text-align:right">${m.time}</div></div>`;
    }else if(m.type === 'voice'){
      // SIMPLE AUDIO PLAYER THAT WILL TALK!
      html += `<div class="bubble ${m.me?'me':'other'}" style="min-width:230px">
        <div style="font-size:12px;font-weight:700;margin-bottom:4px">🎤 Voice Note - ${m.dur||''}</div>
        <audio controls src="${m.data}" preload="auto" controlsList="nodownload"></audio>
        <div style="font-size:10px;color:#666;text-align:right;margin-top:2px">${m.time} • Tap play ▶️</div>
      </div>`;
    }
  }
  if(html === ''){
    html = `<div style="text-align:center;margin:20px;background:#fff;padding:20px;border-radius:12px;color:#666">
      <div style="font-size:40px">💬</div>
      <b>Chat with ${chatName}</b><br>
      <small>Messages are private</small><br><br>
      <div style="background:#f0f2f5;padding:12px;border-radius:10px;text-align:left;font-size:13px">
        <b>✅ HOW TO USE (Fixed):</b><br>
        1. HOLD 🎤 button 2-3 seconds<br>
        2. Speak loud into mic<br>
        3. RELEASE to send<br>
        4. Tap ▶️ on voice to PLAY - Will TALK!<br><br>
        <b>📎 Picture:</b> Tap 📎 to send image<br>
        <b>If old 0:00 shows:</b> Tap 🗑️ Clear at top
      </div>
    </div>`;
  }
  document.getElementById('msgs').innerHTML = html;
  document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
}

function sendText(){
  let inp = document.getElementById('txtIn');
  let txt = inp.value.trim();
  if(!txt) return;
  let arr = getMsgs();
  arr.push({type:'text', text:txt, me:true, time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});
  saveMsgs(arr);
  inp.value = '';
  render();
  setTimeout(()=>{
    let a = getMsgs();
    a.push({type:'text', text:'Thanks! Seller will reply soon...', me:false, time:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});
    saveMsgs(a);
    render();
  }, 1000);
}

function sendImage(input){
  if(!input.files[0]) return;
  let reader = new FileReader();
  reader.onload = function(e){
    let arr = getMsgs();
    arr.push({type:'image', data:e.target.result,[STRIPPED] Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});
    saveMsgs(arr);
    render();
  };
  reader.readAsDataURL(input.files[0]);
}

// VOICE RECORDING - FIXED 100%
let mediaRecorder = null;
let chunks = [];
let isRecording = false;
let startTime = 0;
let micBtn = document.getElementById('micBtn');
let streamRef = null;

async function startRecording(e){
  if(e) e.preventDefault();
  if(isRecording) return;

  try{
    let stream = await navigator.mediaDevices.getUserMedia({audio:true});
    streamRef = stream;

    // Find best mime type for Android
    let mime = 'audio/webm';
    if(MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) mime = 'audio/webm;codecs=opus';
    else if(MediaRecorder.isTypeSupported('audio/webm')) mime = 'audio/webm';
    else if(MediaRecorder.isTypeSupported('audio/mp4')) mime = 'audio/mp4';

    mediaRecorder = new MediaRecorder(stream, {mimeType: mime});
    chunks = [];
    startTime = Date.now();
    isRecording = true;

    mediaRecorder.ondataavailable = function(ev){
      if(ev.data.size > 0) chunks.push(ev.data);
    };

    mediaRecorder.onstop = function(){
      let blob = new Blob(chunks, {type: mime});
      // Check if too short
      if(blob.size < 800){
        alert('Too short! Hold the mic button LONGER - at least 2 seconds and speak!');
        if(streamRef) streamRef.getTracks().forEach(t=>t.stop());
        resetMic();
        return;
      }

      let reader = new FileReader();
      reader.onload = function(ev){
        let duration = Math.round((Date.now() - startTime)/1000);
        let arr = getMsgs();
        arr.push({
          type:'voice',
          data: ev.target.result,
          me: true,
          time: new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),
          dur: duration + 's'
        });
        saveMsgs(arr);
        render();
        if(streamRef) streamRef.getTracks().forEach(t=>t.stop());
        resetMic();
      };
      reader.readAsDataURL(blob);
    };

    mediaRecorder.start();
    micBtn.style.background = '#ff0000';
    micBtn.innerHTML = '🔴';
    document.getElementById('cStatus').innerText = '🔴 RECORDING... Speak now! Release to send';
    document.getElementById('cStatus').style.color = 'red';

  }catch(err){
    alert('Mic error: ' + err.message + '\n\nFIX: 1. Open in Chrome 2. Allow mic permission 3. Must be HTTPS - Vercel is HTTPS so OK');
    resetMic();
  }
}

function stopRecording(e){
  if(e) e.preventDefault();
  if(!isRecording ||!mediaRecorder) return;
  if(mediaRecorder.state === 'recording'){
    mediaRecorder.stop();
  }
  // reset will happen in onstop
}

function resetMic(){
  isRecording = false;
  micBtn.style.background = '#00a884';
  micBtn.innerHTML = '🎤';
  document.getElementById('cStatus').innerText = 'HOLD 🎤 to record - Release to send';
  document.getElementById('cStatus').style.color = '#008069';
}

// HOLD TO RECORD - Like WhatsApp
micBtn.addEventListener('pointerdown', startRecording);
micBtn.addEventListener('pointerup', stopRecording);
micBtn.addEventListener('pointercancel', stopRecording);
micBtn.addEventListener('pointerleave', stopRecording);

// Also for mobile touch
micBtn.addEventListener('touchstart', function(e){ e.preventDefault(); startRecording(e); }, {passive:false});
micBtn.addEventListener('touchend', function(e){ e.preventDefault(); stopRecording(e); }, {passive:false});

render();
</script></body></html>
