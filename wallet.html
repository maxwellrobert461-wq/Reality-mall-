<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wallet - Reality Mall</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4813832175831420" crossorigin="anonymous"></script>
<style>*{box-sizing:border-box;font-family:Arial} body{margin:0;background:#f0f2f5;padding-bottom:80px}.top{background:#fff;padding:14px;position:sticky;top:0;border-bottom:1px solid #ddd}.card{background:#fff;margin:10px;border-radius:16px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}.balance{background:linear-gradient(135deg,#0d63f2,#4a90e2);color:#fff;border-radius:16px;padding:20px;margin:10px}.btn{width:100%;padding:14px;background:#0d63f2;color:#fff;border:none;border-radius:12px;font-weight:800;margin:6px 0;cursor:pointer}.btnGreen{background:#1faa59}.btnBlack{background:#000}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #eee}</style></head><body>
<div class="top"><h2 style="margin:0;color:#0d3c9c">Wallet</h2></div>
<div class="balance"><small>Wallet Balance</small><h1 id="bal" style="margin:6px 0">₦0</h1><div id="vBadge" style="display:inline-block;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:800;background:#fff;color:#a50e0e">Not Verified</div></div>
<div class="card"><h3 style="margin:0">Verify Shop - Blue Tick ✔️</h3><p style="color:#666;font-size:14px">Get 3x views, blue tick. Pays to YOUR Paystack LIVE.</p><button class="btn" onclick="verify()">Verify Now ₦10,000 - Get ₦500 Bonus!</button></div>
<div class="card"><h3 style="margin:0">Add Money / Withdraw</h3><button class="btn btnGreen" onclick="deposit()">Deposit</button><button class="btn btnBlack" onclick="withdraw()">Withdraw (2% fee)</button>
<div style="margin-top:10px"><small style="color:#999">Advertisement</small><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-4813832175831420" data-ad-slot="4444444444" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>
</div>
<div class="card"><b>Transactions</b><div id="tx" style="font-size:13px;color:#555;margin-top:8px">No transactions yet</div></div>
<div class="nav"><div onclick="location.href='index.html'" style="text-align:center;font-size:12px">🏠<br>Home</div><div onclick="location.href='shop.html'" style="text-align:center;font-size:12px">🛍️<br>Shop</div><div onclick="location.href='post.html'" style="width:52px;height:52px;background:#000;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin-top:-20px;border:3px solid #fff">+</div><div onclick="location.href='chat.html'" style="text-align:center;font-size:12px">✉️<br>Inbox</div><div style="color:#0d63f2;font-weight:800;text-align:center;font-size:12px">💰<br>Wallet</div><div onclick="location.href='profile.html'" style="text-align:center;font-size:12px">👤<br>You</div></div>
<script>
const MY_KEY='pk_live_16a8e4130e54cdbd8eb5a693ae37a52d874e3ee0';
function getWallet(){return JSON.parse(localStorage.getItem('rm_wallet')||'{"balance":0,"verified":false,"tx":[]}')}
function setWallet(w){localStorage.setItem('rm_wallet',JSON.stringify(w))}
function load(){let w=getWallet(); document.getElementById('bal').innerText='₦'+w.balance.toLocaleString(); document.getElementById('vBadge').innerText=w.verified?'✔️ Verified':'Not Verified'; document.getElementById('tx').innerHTML=(w.tx||[]).slice(-10).reverse().map(t=>'<div>• '+t.type+' ₦'+t.amount+' - '+t.ref+'</div>').join('')||'No transactions yet';}
function deposit(){let amt=prompt('Amount ₦'); if(!amt) return; amt=parseInt(amt); PaystackPop.setup({key:MY_KEY,email:localStorage.getItem('myEmail')||'oderachidalu@gmail.com',amount:amt*100,currency:'NGN',ref:'DEP_'+Date.now(),callback:function(r){let w=getWallet(); w.balance+=amt; w.tx.push({type:'Deposit',amount:amt,ref:r.reference}); setWallet(w); alert('Deposited ₦'+amt); load();}}).openIframe();}
function withdraw(){let w=getWallet(); if(w.balance<100) return alert('Min ₦100'); let amt=parseInt(prompt('Withdraw amount, Bal ₦'+w.balance)||0); if(!amt||amt>w.balance) return; let fee=Math.ceil(amt*0.02); w.balance-=amt; w.tx.push({type:'Withdraw',amount:amt-fee,ref:'Fee ₦'+fee}); setWallet(w); alert('Withdraw ₦'+(amt-fee)); load();}
function verify(){let w=getWallet(); if(w.verified) return alert('Verified!'); PaystackPop.setup({key:MY_KEY,email:localStorage.getItem('myEmail')||'oderachidalu@gmail.com',amount:10000*100,currency:'NGN',ref:'VERIFY_'+Date.now(),callback:function(r){w.verified=true; w.balance+=500; w.tx.push({type:'Verify Bonus',amount:500,ref:r.reference}); setWallet(w); alert('Verified! Bonus ₦500 added! Ref:'+r.reference); load();}}).openIframe();}
load();
</script></body></html>
