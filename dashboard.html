<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Post - REALITY MALL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:Arial;padding:15px;background:#f5f5f5}input,select,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}button{width:100%;padding:14px;background:#000;color:#fff;border:none;border-radius:8px;font-weight:bold;font-size:16px;margin-top:10px}</style>
</head>
<body>
<h2>REALITY. - Post Product</h2>
<a href="index.html">← Back to Mall</a><br><br>

<input type="text" id="shop_name" placeholder="Your Shop Name">
<input type="text" id="name" placeholder="Product Name e.g. iPhone 13">
<input type="number" id="price" placeholder="Price e.g. 500000">
<input type="text" id="whatsapp" placeholder="Your WhatsApp Number e.g. 2349078617514">
<select id="feed_type"><option value="shops">Shops Feed</option><option value="posts">Posts Feed</option><option value="video">Video Feed</option></select>
<input type="file" id="imageFile" accept="image/*">
<textarea id="content" placeholder="Description"></textarea>
<button onclick="postNow()" id="btn">POST FREE - Publish Now</button>
<p id="status"></p>

<script>
const SUPABASE_URL = 'https://trawtkndvzsplcmmtjox.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_ACkUQyZDMHThA7SYE1ME2w_HMNjyIXg';
const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function postNow(){
 const btn=document.getElementById('btn'); const s=document.getElementById('status');
 const shop_name=document.getElementById('shop_name').value; const name=document.getElementById('name').value;
 const price=document.getElementById('price').value; const whatsapp=document.getElementById('whatsapp').value;
 const feed_type=document.getElementById('feed_type').value; const content=document.getElementById('content').value;
 const file=document.getElementById('imageFile').files[0];
 if(!name||!price||!whatsapp||!file){alert('Fill name, price, whatsapp and image');return}
 btn.innerText='Uploading...'; btn.disabled=true; s.innerText='Uploading image...';
 try{
  const fileName = Date.now()+'_'+file.name.replace(/[^a-z0-9.]/gi,'_');
  const {error:upErr} = await client.storage.from('reality-media').upload(fileName, file, {upsert:true});
  if(upErr) throw upErr;
  const {data:pub} = client.storage.from('reality-media').getPublicUrl(fileName);
  const imageUrl = pub.publicUrl;
  s.innerText='Saving product...';
  const {error:insErr} = await client.from('products').insert([{
    shop_name, name, price: parseInt(price), whatsapp, feed_type, content, image: imageUrl, status:'approved', views:0
  }]);
  if(insErr) throw insErr;
  s.innerText='✅ SUCCESS! Posted! Go to Home';
  alert('Posted! Check homepage'); window.location.href='index.html';
 }catch(e){
  s.innerText='❌ Error: '+e.message; btn.innerText='POST FREE - Publish Now'; btn.disabled=false;
  if(e.message.includes('Bucket not found')) alert('Go to Supabase > Storage > New Bucket > reality-media > Public ON > Create');
 }
}
</script>
</body>
</html>
