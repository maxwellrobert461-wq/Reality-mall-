<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Post - REALITY MALL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:Arial} body{margin:0;background:#f5f6fa;padding:10px}
.box{background:#fff;max-width:500px;margin:15px auto;padding:20px;border-radius:16px}
input,textarea,select{width:100%;padding:14px;margin:8px 0;border-radius:12px;border:2px solid #e8eefc;background:#eef4ff;font-size:16px}
button{width:100%;padding:16px;background:#000;color:#fff;border:none;border-radius:12px;font-weight:900;margin-top:10px}
#prev{width:100%;border-radius:12px;display:none;margin-top:8px}
</style>
</head>
<body>
<div style="max-width:500px;margin:auto;display:flex;justify-content:space-between">
<a href="index.html">← Back to Mall</a><a href="profile.html">My Profile</a>
</div>
<div class="box">
<h2>Post to REALITY MALL</h2>
<input id="name" value="Odera chidalu Vitalis">
<input id="phone" value="+2349078617514">
<select id="type"><option>Shop Product (with price)</option></select>
<input id="price" placeholder="Price in Naira">
<textarea id="content" rows="4">Looking happy</textarea>
<input id="file" type="file" accept="image/*" onchange="previewFile()">
<img id="prev">
<div id="msg" style="margin:10px 0;font-weight:bold"></div>
<button id="btn" onclick="doPost()">Post Now</button>
<p style="font-size:12px;color:#888">Profile auto-created. Click your name to see products.</p>
</div>
<script>
const client=supabase.createClient('https://trawtkndvzsplcmmtjox.supabase.co','sb_publishable_ACkUQyZDMHThA7SYE1ME2w_HMNjyIXg');
let imgData='';
function previewFile(){
 let f=document.getElementById('file').files[0]; if(!f) return;
 let r=new FileReader(); r.onload=()=>{imgData=r.result; document.getElementById('prev').src=imgData; document.getElementById('prev').style.display='block';}; r.readAsDataURL(f);
}
async function doPost(){
 let m=document.getElementById('msg'); let b=document.getElementById('btn');
 let name=document.getElementById('name').value, phone=document.getElementById('phone').value, content=document.getElementById('content').value, price=document.getElementById('price').value;
 if(!content){m.innerHTML='Write something'; return}
 b.innerText='Posting... please wait';
 // If no image selected, use placeholder
 if(!imgData) imgData='https://via.placeholder.com/400x400?text='+encodeURIComponent(name);
 try{
  let {error}=await client.from('products').insert([{shop_name:name,phone:phone,content:content,price:parseInt(price)||0,image:imgData,location:'Warri',views:0}]);
  if(error) throw error;
  m.style.color='green'; m.innerHTML='✅ SUCCESS! Posted "Looking happy"'; b.innerText='Posted! Go to Mall';
  setTimeout(()=>location.href='index.html',1200);
 }catch(e){
  m.style.color='red'; m.innerHTML='❌ Error: '+e.message+'<br>Check: Did you run SQL?'; b.innerText='Post Now';
  console.log(e);
 }
}
// auto load previous image as preview
previewFile();
</script>
</body>
</html>
