<script src="https://js.paystack.co/v1/inline.js"></script>

<!-- REPLACE BUY BUTTON WITH THIS -->
<button id="payBtn" onclick="payWithPaystack()" style="width:100%;padding:16px;background:#000;color:#fff;border:none;border-radius:12px;font-weight:900;font-size:16px">💳 Pay with Paystack - ₦<span id="pPrice">0</span></button>
<p style="font-size:12px;color:#888;text-align:center">Secure payment. Seller gets 98%, App fee 2% for withdrawal.</p>

<script>
const PAYSTACK_KEY = 'pk_live_16a8e4130e54cdbd8eb5a693ae37a52d874e3ee0'; // Use test key for testing: pk_test_234282edd655fe3a25eb1f694013e3f0d29fd201
function payWithPaystack(){
 let price = parseInt(document.getElementById('pPrice').innerText.replace(/,/g,''))||1000;
 let email = localStorage.getItem('myEmail')||'buyer@realitymall.com';
 let handler = PaystackPop.setup({
  key: PAYSTACK_KEY,
  email: email,
  amount: price * 100, // Paystack uses kobo
  currency: 'NGN',
  ref: 'RM_'+Date.now(),
  callback: function(res){
   // Payment success - save order + 2% fee
   let fee = Math.floor(price * 0.02);
   let seller_gets = price - fee;
   alert('Payment success! Ref: '+res.reference+'\nSeller gets ₦'+seller_gets+' (98%)\nApp fee ₦'+fee+' (2%)');
   // Save to Supabase orders
   supa.from('orders').insert([{buyer_id:localStorage.getItem('user_id'),product_id:new URLSearchParams(location.search).get('id'),amount:price,fee:fee,paystack_ref:res.reference}]);
   location.href='chat.html?id='+new URLSearchParams(location.search).get('id'); // Go to chat seller
  },
  onClose: function(){ alert('Payment closed') }
 });
 handler.openIframe();
}
</script>
