<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post - Reality Mall</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4813832175831420" crossorigin="anonymous"></script>
<style>*{box-sizing:border-box;font-family:Arial} body{margin:0;background:#f0f2f5}.card{background:#fff;margin:10px;border-radius:14px;padding:14px}.input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin:6px 0}.btn{width:100%;padding:14px;background:#0d63f2;color:#fff;border:none;border-radius:12px;font-weight:800;cursor:pointer}</style></head><body>
<div style="background:#fff;padding:14px;display:flex;justify-content:space-between;border-bottom:1px solid #eee"><b>Create Post - Only on YOUR Profile</b><span onclick="location.href='index.html'">✕</span></div>
<div class="card">
<input id="title" class="input" placeholder="Product Title - e.g. Nike Shoes">
<input id="price" type="number" class="input" placeholder="Price - e.g. 15000">
<select id="cat" class="input"><option>Fashion</option><option>Electronics</option><option>Feed</option><option>Reels</option></select>
<input type="file" id="img" accept="image/*" class="input" onchange="preview(this)">
<img id="prev" style="width:100%;border-radius:10px;display:none;max-height:250px;object-fit:cover">
<button class="btn" onclick="doPost()">Post to MY Profile Only 🔒</button>
<div style="margin-top:10px"><small style="color:#999">Advertisement</small><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-4813832175831420" data-ad-slot="3333333333" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>
</div>
<script>
let imgData=''; function preview(inp){let r=new FileReader(); r.onload=e=>{imgData=e.target.result; document.getElementById('prev').src=imgData; document.getElementById('prev').style.display='block';}; r.readAsDataURL(inp.files[0]);}
function doPost(){
let title=document.getElementById('title').value, price=document.getElementById('price').value, cat=document.getElementById('cat').value;
if(!title||!price||!imgData) return alert('Add title, price, image!');
let prof=JSON.parse(localStorage.getItem('rm_profile')||'{"name":"Odera"}');
let posts=JSON.parse(localStorage.getItem('rm_posts')||'[]');
posts.push({title, price, cat, img:imgData, seller:prof.name, date:Date.now()});
localStorage.setItem('rm_posts',JSON.stringify(posts));
alert('✅ Posted! Only on YOUR profile: '+prof.name);
location.href='profile.html';
}
</script></body></html>
