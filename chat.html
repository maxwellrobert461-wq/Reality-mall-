<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chats - Reality Mall</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4813832175831420" crossorigin="anonymous"></script>
<style>*{box-sizing:border-box;font-family:Arial} body{margin:0;background:#fff;padding-bottom:80px}
.top{background:#fff;padding:14px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}
.tab{display:flex;gap:0;background:#f0f2f5;margin:10px;border-radius:12px;padding:4px}
.tab div{flex:1;text-align:center;padding:10px;border-radius:8px;cursor:pointer;font-weight:700;font-size:14px}
.activeTab{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);color:#0d63f2}
.chatItem{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid #f5f5f5}
.av{width:48px;height:48px;border-radius:50%;background:#0d63f2;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #eee}
</style></head><body>
<div class="top"><h3 style="margin:0">Chats</h3><span onclick="location.href='index.html'">✕</span></div>
<div class="tab"><div id="tabAll" class="activeTab" onclick="showAll()">All Chats</div><div id="tabGroup" onclick="showGroup()">Group</div><div id="tabSell" onclick="showSellers()">Sellers</div></div>
<div id="chatList"></div>
<div style="padding:12px;margin:10px;border:1px solid #eee;border-radius:12px"><small style="color:#999">Advertisement</small><ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-4813832175831420" data-ad-slot="5555555555" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>
<div class="nav"><div onclick="location.href='index.html'" style="text-align:center;font-size:12px">🏠<br>Home</div><div onclick="location.href='shop.html'" style="text-align:center;font-size:12px">🛍️<br>Shop</div><div onclick="location.href='post.html'" style="width:52px;height:52px;background:#000;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;margin-top:-20px;border:3px solid #fff">+</div><div style="color:#0d63f2;font-weight:800;text-align:center;font-size:12px">✉️<br>Inbox</div><div onclick="location.href='wallet.html'" style="text-align:center;font-size:12px">💰<br>Wallet</div><div onclick="location.href='profile.html'" style="text-align:center;font-size:12px">👤<br>You</div></div>
<script>
var allChats=[{name:"Warri Sellers Group",last:"Group chat - Everyone here",time:"9:11 PM",letter:"W",type:"group"},{name:"Odera - CEO",last:"I built this for Warri!",time:"9:10 PM",letter:"O",type:"seller"},{name:"Fashion Hub Warri",last:"New shoes!",time:"8:45 PM",letter:"F",type:"seller"}];
function drawList(list){var h="";for(var i=0;i<list.length;i++){var c=list[i];h+='<div class="chatItem" onclick="openChat(\''+c.name+'\')"><div class="av">'+c.letter+'</div><div style="flex:1"><div style="display:flex;justify-content:space-between"><b>'+c.name+'</b><small style="color:#888">'+c.time+'</small></div><div style="font-size:13px;color:#666">'+c.last+'</div></div></div>';}document.getElementById("chatList").innerHTML=h;}
function showAll(){document.getElementById("tabAll").className="activeTab";document.getElementById("tabGroup").className="";document.getElementById("tabSell").className="";drawList(allChats);}
function showGroup(){document.getElementById("tabAll").className="";document.getElementById("tabGroup").className="activeTab";document.getElementById("tabSell").className="";var g=[];for(var i=0;i<allChats.length;i++){if(allChats[i].type=="group")g.push(allChats[i]);}drawList(g);}
function showSellers(){document.getElementById("tabAll").className="";document.getElementById("tabGroup").className="";document.getElementById("tabSell").className="activeTab";var s=[];for(var i=0;i<allChats.length;i++){if(allChats[i].type=="seller")s.push(allChats[i]);}drawList(s);}
function openChat(n){localStorage.setItem("currentChat",n);location.href="chat_room.html?name="+encodeURIComponent(n);}
showAll();
</script></body></html>
