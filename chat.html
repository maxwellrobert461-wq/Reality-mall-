<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat - Reality Mall</title>
<style>
*{box-sizing:border-box;font-family:Arial} body{margin:0;background:#e5ddd5}
.top{background:#008069;color:#fff;padding:12px;font-weight:700;display:flex;justify-content:space-between}
.chats{padding:10px;padding-bottom:80px}
.msg{background:#fff;padding:8px 12px;border-radius:12px;margin:8px 0;max-width:80%;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.me{background:#d9fdd3;margin-left:auto}
.audioWrap{width:240px}
audio{width:100%;height:40px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#f0f0f0;padding:8px;display:flex;gap:6px;align-items:center}
.input{flex:1;padding:12px;border-radius:24px;border:none}
.btn{width:44px;height:44px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.rec{background:#008069;color:#fff}.send{background:#008069;color:#fff}
.rec.recording{background:red;animation:pulse 1s infinite} @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}}
</style></head><body>
<div class="top"><span id="chatName">Warri Sellers Group (12 members)</span><span onclick="location.href='index.html'">✕</span></div>
<div id="chats" class="chats"></div>
<div class="bottom">
<label style="width:36px;text-align:center">📷<input type="file" accept="image/*" hidden onchange="sendImage(this)"></label>
<input id="txt" class="input" placeholder="Type a message...">
<button id="recBtn" class="btn rec" onclick="toggleRec()">🎤</button>
<button class="btn send" onclick="sendText()">➤</button>
</div>
<script>
let messages=JSON.parse(localStorage.getItem('warri_chats')||'[]');
if(messages.length==0){messages=[
{type:'text',text:'Hi',me:false,time:'9:11 PM'},
{type:'text',text:'Thanks! Seller will reply soon. For faster response call group',me:false,time:'9:11 PM'},
];}
let mediaRec=null, chunks=[], isRec=false, recStart=0;

function render(){
 document.getElementById('chats').innerHTML=messages.map(m=>{
  if(m.type=='voice'){
   return `<div class="msg ${m.me?'me':''}"><div class="audioWrap"><audio controls src="${m.src}"></audio><small>Voice note • ${m.time}</small></div></div>`;
  }else if(m.type=='image'){
   return `<div class="msg ${m.me?'me':''}"><img src="${m.src}" style="width:200px;border-radius:8px"><br><small>${m.time}</small></div>`;
  }else{
   return `<div class="msg ${m.me?'me':''}">${m.text}<br><small>${m.time}</small></div>`;
  }
 }).join('');
 window.scrollTo(0,document.body.scrollHeight);
}
function getTime(){return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});}
function sendText(){
 let t=document.getElementById('txt').value.trim(); if(!t) return;
 messages.push({type:'text',text:t,me:true,time:getTime()}); save(); document.getElementById('txt').value='';
}
function sendImage(inp){
 let r=new FileReader(); r.onload=e=>{
  messages.push({type:'image',src:e.target.result,me:true,time:getTime()}); save();
 }; r.readAsDataURL(inp.files[0]);
}
async function toggleRec(){
 if(!isRec){ startRec(); } else { stopRec(); }
}
async function startRec(){
 try{
  let stream=await navigator.mediaDevices.getUserMedia({audio:true});
  mediaRec=new MediaRecorder(stream); chunks=[];
  mediaRec.ondataavailable=e=>{if(e.data.size>0) chunks.push(e.data);};
  mediaRec.onstop=async()=>{
   let blob=new Blob(chunks,{type:'audio/webm'});
   if(blob.size<1000){ alert('Hold mic for at least 1 sec!'); return; }
   let reader=new FileReader();
   reader.onloadend=()=>{
    messages.push({type:'voice',src:reader.result,me:true,time:getTime()});
    save();
    // Clear old 0:00 notes
    messages=messages.filter(m=>!(m.type=='voice' && (!m.src || m.src.length<100)));
    localStorage.setItem('warri_chats',JSON.stringify(messages));
   };
   reader.readAsDataURL(blob);
   stream.getTracks().forEach(t=>t.stop());
  };
  mediaRec.start(); isRec=true; recStart=Date.now();
  document.getElementById('recBtn').classList.add('recording');
  document.getElementById('recBtn').innerText='⬛';
 }catch(e){alert('Mic permission needed! Allow microphone in browser settings. '+e.message);}
}
function stopRec(){
 if(mediaRec && isRec){
  mediaRec.stop(); isRec=false;
  document.getElementById('recBtn').classList.remove('recording');
  document.getElementById('recBtn').innerText='🎤';
 }
}
function save(){localStorage.setItem('warri_chats',JSON.stringify(messages)); render();}
function clearBadVoices(){ // Run once to delete your 0:00 notes
 messages=messages.filter(m=>!(m.type=='voice' && (!m.src || m.src.includes('0:00') || m.src.length<200)));
 localStorage.setItem('warri_chats',JSON.stringify(messages)); render(); alert('Deleted bad 0:00 voice notes! Now record new one.');
}
render();
// Auto clean bad notes on load
setTimeout(clearBadVoices,1000);
</script></body></html>
