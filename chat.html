<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat - REALITY MALL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;font-family:Arial}.top{background:#000;color:#fff;padding:12px}.msgs{height:70vh;overflow-y:auto;padding:10px}.msg{padding:8px 12px;border-radius:12px;margin:6px 0;max-width:70%}.me{background:#ffc300;margin-left:auto}.other{background:#eee}.input{position:fixed;bottom:0;left:0;right:0;display:flex;padding:10px;background:#fff}.input input{flex:1;padding:12px;border-radius:20px;border:1px solid #ddd}.input button{background:#000;color:#fff;border:none;padding:12px 18px;border-radius:20px;margin-left:6px}</style>
</head><body>
<div class="top"><a href="index.html" style="color:#fff">← Mall</a> <span id="chatName">Chat</span> <button onclick="createGroup()" style="float:right;background:#ffc300;border:none;padding:6px 10px;border-radius:10px">+ Group</button></div>
<div id="msgs" class="msgs"></div>
<div class="input"><input id="txt" placeholder="Type message..."><button onclick="send()">Send</button></div>
<script>
const client=supabase.createClient('https://trawtkndvzsplcmmtjox.supabase.co','sb_publishable_ACkUQyZDMHThA7SYE1ME2w_HMNjyIXg');
let chatId=new URLSearchParams(location.search).get('id')||'global';
async function load(){let {data}=await client.from('messages').select('*').eq('chat_id',chatId).order('created_at'); let h=''; data?.forEach(m=>{h+=`<div class="msg ${m.sender_id==localStorage.getItem('user_id')?'me':'other'}"><b>${m.sender_name}:</b> ${m.content}</div>`}); document.getElementById('msgs').innerHTML=h; document.getElementById('msgs').scrollTop=99999}
async function send(){let c=txt.value; if(!c) return; await client.from('messages').insert([{chat_id:chatId,sender_id:localStorage.getItem('user_id')||'guest',sender_name:localStorage.getItem('myShop')||'Buyer',content:c}]); txt.value=''; load()}
async function createGroup(){let name=prompt('Group name? e.g. Warri Phones Sellers'); if(!name) return; let {data}=await client.from('chats').insert([{type:'group',name:name,members:[localStorage.getItem('user_id')],created_by:localStorage.getItem('user_id')}]).select(); alert('Group created! ID: '+data[0].id); location.href='chat.html?id='+data[0].id}
setInterval(load,2000); load();
</script>
</body></html>
