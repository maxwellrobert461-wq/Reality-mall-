<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chats - Reality Mall</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4813832175831420" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box;font-family:Arial;margin:0} body{background:#fff;padding-bottom:80px}
.top{background:#fff;padding:14px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}
.tab{display:flex;background:#f0f2f5;margin:10px;border-radius:12px;padding:4px}
.tab div{flex:1;text-align:center;padding:10px;border-radius:8px;font-weight:700;cursor:pointer}
.active{background:#fff;color:#0d63f2;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.item{display:flex;gap:12px;padding:14px;border-bottom:1px solid #f5f5f5;cursor:pointer}
.av{width:50px;height:50px;border-radius:50%;background:#0d63f2;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:space-around;padding:8px 0;border-top:1px solid #eee;z-index:99}
</style></head><body>
<div class="top"><h3>Chats</h3><span onclick="location.href='index.html'" style="font-size:22px">✕</span></div>
<div class="tab">
<div id="a1" class="active" onclick="filterChat('all',0)">All Chats</div>
<div id="a2" onclick="filterChat('group',1)">Group</div>
<div id="a3" onclick="filterChat('seller',2)">Sellers</div>
</div>
<div id="list"></div>
<div style="margin:10px;padding:10px;border:1px solid #eee;border-radius:12px"><small style="color:#999">Advertisement</small>
<ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-4813832175831420" data-ad-slot="5555555555" data-ad-format="auto" data-full-width-responsive="true"></ins><script>(adsbygoogle=window.adsbygoogle||[]).push({});</script></div>
<div class="nav">
<div onclick="location.href='index.html'" style="text-align:center;font-size:12px">🏠<br>Home</div>
<div onclick="location.href='shop.html'" style="text-align:center;font-size:12px">🛍️<br>Shop</div>
<div onclick="location.href='post.html'" style="width:56px;height:56px;background:#000;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;margin-top:-22px;border:3px solid #fff">+</div>
<div style="color:#0d63f2;font-weight:800;text-align:center;font-size:12px">✉️<br>Inbox</div>
<div onclick="location.href='wallet.html'" style="text-align:center;font-size:12px">💰<br>Wallet</div>
<div onclick="location.href='profile.html'" style="text-align:center;font-size:12px">👤<br>You</div>
</div>
<script>
var chats=[
{name:"Warri Sellers Group",last:"Tap to open group chat",time:"9:11 PM",letter:"W",type:"group"},
{name:"Odera - CEO",last:"Hi! I built Reality Mall",time:"9:10 PM",letter:"O",type:"seller"},
{name:"Fashion Hub Warri",last:"New shoes available",time:"8:45 PM",letter:"F",type:"seller"}
];
function draw(arr){
var h="";for(var i=0;i<arr.length;i++){var c=arr[i];h+='<div class="item" onclick="openChat(\''+c.name+'\')"><div class="av">'+c.letter+'</div><div style="flex:1"><div style="display:flex;justify-content:space-between"><b>'+c.name+'</b><small style="color:#888">'+c.time+'</small></div><div style="font-size:13px;color:#666">'+c.last+'</div></div></div>';}
document.getElementById("list").innerHTML=h;
}
function filterChat(type,idx){
document.getElementById("a1").className="";document.getElementById("a2").className="";document.getElementById("a3").className="";
document.getElementById("a"+(idx+1)).className="active";
if(type=="all")draw(chats);
else{var f=[];for(var i=0;i<chats.length;i++){if(chats[i].type==type)f.push(chats[i]);}draw(f);}
}
function openChat(n){localStorage.setItem("currentChat",n);location.href="chat_room.html?name="+encodeURIComponent(n);}
draw(chats);
</script></body></html>
